# Triaged dependency advisories: the debt ledger behind `task audit`
# (scripts/audit_deps.py; policy in Decisions.md ADR-20).
#
# Every advisory the audit reports must be fixed or listed here. Each entry needs a
# reason a reviewer can check and a review_by date. Past that date the gate fails
# until someone re-triages: upgrade the dependency, or set a new date with a fresh
# reason. An id listed here that the audit no longer reports is flagged as stale;
# delete it.
#
# Fields: ecosystem ("pypi" | "npm"), package, ids (advisory ids or their aliases),
#         reason, review_by, projects (optional; omit to match in any project:
#         api, api-gpu, manager, client, manager-ui, docs-site).

# --- Python (API images) ------------------------------------------------------

[[advisory]]
ecosystem = "pypi"
package = "transformers"
ids = ["PYSEC-2025-217", "PYSEC-2025-218", "PYSEC-2026-2288", "PYSEC-2026-2289",
       "PYSEC-2026-2290", "PYSEC-2026-3929", "PYSEC-2026-4174"]
reason = """
Fixed only in 5.x (a breaking major that sentence-transformers 5.7 and the
translation kit haven't moved to), or not fixed at all. AgX never trains, never
calls save_pretrained or load_custom_generate, and loads none of the X-CLIP,
GLM4 or LightGlue code. The live one is PYSEC-2026-2289 (a malicious
config.json in a loaded repo): AgX loads four operator-chosen repos (bge-m3,
the reranker, NLLB-200, language detection), so the exposure is a compromised
upstream repo. Mitigation to do: pin model revisions. Leaves with the
torch-free track (todo/phases/19 §19.2.6) or a transformers 5 migration.
"""
review_by = 2027-01-31

[[advisory]]
ecosystem = "pypi"
package = "torch"
ids = ["PYSEC-2025-194"]
reason = """
Memory corruption in torch.jit.script, local only. Neither AgX nor the model
code it loads (XLM-R, M2M-100) calls jit.script. The fix is torch 2.13, whose
Linux wheels would move the GPU image off CUDA 12.8; take it with that
decision.
"""
review_by = 2027-01-31

[[advisory]]
ecosystem = "pypi"
package = "setuptools"
ids = ["PYSEC-2026-3447", "GHSA-xmj3-9gf7-h52w"]
reason = """
Both are package-build/install paths (sdist MANIFEST.in matching on macOS;
legacy wheel install on Windows), not runtime. torch 2.11 requires
setuptools<82, so the fixed 83/84 lines wait on torch.
"""
review_by = 2027-01-31

[[advisory]]
ecosystem = "pypi"
package = "filelock"
ids = ["CVE-2026-112907", "CVE-2026-112913", "CVE-2026-112940"]
reason = """
Two are in ReadWriteLock/AsyncReadWriteLock, which no consumer uses
(huggingface-hub, torch and transformers only take FileLock). The third is the
Windows soft lock; huggingface-hub falls back to SoftFileLock only on
filesystems without flock, and the images are Linux. The fix is filelock 4.x,
a major: Dependabot's major group proposes it and the CI suite vets it.
"""
review_by = 2027-01-31

