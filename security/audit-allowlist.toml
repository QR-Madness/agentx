# --- Docs site ----------------------------------------------------------------
# A static build (no adapter, no SSR, no on-demand image endpoint) of the repo's
# own content. Every advisory below needs attacker-controlled input, and the only
# inputs are the repo's files, so keep Vercel's fork protection on (fork-PR
# previews wait for approval). The trigger to clear most of these is the Astro 7
# migration, which brings sharp 0.35 and esbuild 0.28 with it.

[[advisory]]
ecosystem = "npm"
package = "astro"
ids = ["GHSA-26w7-cxv4-gfx2", "GHSA-376h-93r7-7g6f", "GHSA-4g3v-8h47-v7g6",
       "GHSA-7pw4-f3q4-r2p2", "GHSA-98hj-9722-w3j8", "GHSA-f48w-9m4c-m7f5"]
projects = ["docs-site"]
reason = """
Fixed only in astro 7.x (a major). The critical one is RCE in AVIF optimization,
which needs an attacker-supplied image; the rest are XSS and an auth bypass in
rendering or SSR paths, fed here only by trusted repo content.
"""
review_by = 2027-01-31

