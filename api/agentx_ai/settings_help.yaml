# Per-setting help — the single authored source.
#
# Rendered in two places from one text: the settings UI (beside the control, via
# GET /api/settings/manifest) and the docs site's Settings Reference (generated by
# scripts/gen_settings_reference.py). Never write per-setting prose anywhere else —
# a second copy is a second thing to keep true.
#
# Shape:
#   <store>:                       # "config" (dotted paths) | "memory" (field names)
#     <key>:
#       summary: One line. What it does, in the user's terms. Shown collapsed.
#       what:    What this actually is — the concept, not the mechanism.
#       how:     How it works. Concrete: what happens at request time.
#       why:     Why and when you'd change it. Name the trade-off and the direction.
#       manage:  How to manage it — what it interacts with, what to watch, safe ranges.
#
# Plus one store a level up — `sections`, keyed by settings-screen id, describing
# the screen rather than a key. Three fields (summary / what / why), rendered on
# the Overview tiles, in each screen's header, and as the section intro in the
# generated reference. Every screen in the nav has one; the id set is asserted
# against the client's SECTION_HIERARCHY, so a new screen can't ship without it.
#
# Register: write for someone competent who has never read this subsystem's code.
# Prefer the concrete number over the adjective. Name the cost. Say when NOT to
# touch it. Every field is optional; a key with only `summary` is a stub.
#
# Coverage: `memory` recall keys are fully authored (the reference standard).
# Other sections are being refit on a cadence — see todo/backlog/genome-advisor.md.

memory:
  # ── Retrieval techniques ────────────────────────────────────────────────
  recall_enable_hybrid:
    summary: Search memory by keyword and by meaning at once, then fuse the two rankings.
    what: >-
      The default way memory is searched. Two searches run over the same facts: BM25
      keyword matching (does this text contain these words?) and vector similarity
      (does this text mean something close?). Their rankings are then merged.
    how: >-
      Both searches run against the channel list for the turn, each producing a ranked
      list. The lists are fused with Reciprocal Rank Fusion — a fact scores on where it
      placed in each list rather than on raw scores, so two incomparable scoring systems
      can be combined without normalising them. A fact ranked well by both rises highest.
    why: >-
      Leave it on. Keyword-only search misses paraphrase ("what does she drive" vs "her
      car is a Volvo"); vector-only search misses exact tokens (identifiers, error codes,
      names it has never seen). Fusing covers both failure modes at the cost of one extra
      query. Turn it off only to isolate a retrieval problem while debugging.
    manage: >-
      The balance between the two is `recall_hybrid_bm25_weight` and
      `recall_hybrid_vector_weight`; the fusion constant is `recall_hybrid_rrf_k`. With
      this off, those three do nothing.

  recall_enable_entity_centric:
    summary: Find facts by walking the entity graph instead of matching text.
    what: >-
      A retrieval path that goes through *things* rather than words. When a query names
      an entity the agent already knows, its facts are pulled directly from the graph.
    how: >-
      Entities are matched from the query above `recall_entity_similarity_threshold`, up
      to `recall_entity_max_entities` of them. Facts attached to those entities are
      collected, following relationships out to `recall_entity_graph_depth` hops.
    why: >-
      Keep it on when the agent accumulates knowledge about recurring people, projects,
      or systems. It answers questions text search cannot — "what do we know about
      Redis" returns facts that never contain the word "Redis" but hang off that entity.
      The cost is a graph query per turn.
    manage: >-
      If it returns loosely-related material, raise `recall_entity_similarity_threshold`
      before reaching for graph depth. Depth is the expensive dial, not the threshold.

  recall_enable_query_expansion:
    summary: Rewrite the question a few ways before searching, so phrasing matters less.
    what: >-
      A pre-search step that generates alternative phrasings of the query and searches
      with all of them, so a stored fact worded differently from the question still
      surfaces.
    how: >-
      The query is transformed into up to `recall_expansion_max_variants` variants —
      "When is my birthday?" also becomes "birthday is", "born on" — each is searched,
      and the results are merged and deduplicated.
    why: >-
      Worth keeping on. Stored facts are declarative ("her birthday is in March") while
      questions are interrogative; the mismatch is the single most common reason a fact
      that exists fails to come back. Costs one extra search per variant.
    manage: >-
      Raise `recall_expansion_max_variants` only if recall is visibly missing rephrased
      facts — each variant is another search, and the return falls off quickly past 3.

  recall_enable_hyde:
    summary: Imagine the answer first, then search for facts that look like it.
    what: >-
      Hypothetical Document Embedding. Instead of searching with the question, the agent
      drafts a plausible answer and searches with *that* — because a made-up answer sits
      much closer in vector space to the real one than the question does.
    how: >-
      A small model (`recall_hyde_model`) writes a short hypothetical answer at
      `recall_hyde_temperature`, capped at `recall_hyde_max_tokens`. That text is
      embedded and used as the vector query. The invented answer is never shown to
      anyone and never stored — it exists only to shape the search.
    why: >-
      Enable for abstract or explanatory questions, where question and answer share few
      words. It costs a real LLM call on every recall, so it is the most expensive
      technique here — the first thing to disable if recall latency matters more than
      recall depth.
    manage: >-
      Needs a working model; leave `recall_hyde_model` empty to follow the Fast Utility
      role rather than pinning one. Keep `recall_hyde_max_tokens` small (~150) — you need
      the shape of an answer, not a good one.

  recall_enable_self_query:
    summary: Pull filters out of the question — dates, names — and search within them.
    what: >-
      A step that reads structured constraints out of natural language, so "what did we
      decide last week" becomes a search restricted to last week rather than a text
      search containing the words "last week".
    how: >-
      A small model (`recall_self_query_model`) extracts filters — time ranges, entity
      names, keywords — at `recall_self_query_temperature`, capped at
      `recall_self_query_max_tokens`. Extracted filters narrow the candidate set before
      ranking.
    why: >-
      Enable when questions carry real constraints — time-bounded, person-scoped,
      project-scoped. Without it, "last week" is just two more tokens to match and the
      agent happily returns something from March. Like HyDE it costs an LLM call.
    manage: >-
      Keep temperature low (0.2) — this is extraction, not writing; creativity here means
      invented filters that silently exclude the right answer.

  # ── Two-stage rerank ────────────────────────────────────────────────────
  cross_encoder_enabled:
    summary: Re-score the shortlist with a slower, more accurate model before answering.
    what: >-
      The second stage of retrieval. The fast searches propose a pool of candidates; a
      cross-encoder then reads each candidate together with the query and re-orders them.
      Worth about +20pp MRR on the golden recall set.
    how: >-
      Stage 1 deliberately over-fetches `recall_candidate_pool` candidates. Stage 2 scores
      each one against the query with `cross_encoder_model` — which, unlike an embedding
      search, sees query and candidate *at the same time* and can judge whether one
      actually answers the other — then cuts back to top-k. The model lazy-loads on first
      use, and a failure is non-fatal: recall falls back to stage-1 order.
    why: >-
      Leave it on. It is the single largest accuracy win in the recall path. Turn it off
      only where the model cannot be loaded, or where per-turn latency is tighter than
      answer quality.
    manage: >-
      Governs `recall_candidate_pool` and `recall_ce_max_demotion` — with this off, both
      are inert. First use pays a one-time model load.

  cross_encoder_model:
    summary: The Hugging Face cross-encoder that re-scores candidates.
    what: A local sentence-transformers cross-encoder identifier, loaded on first recall.
    how: >-
      Downloaded and cached on first use, then held in memory. It runs locally on CPU or
      GPU — no API calls, no per-query cost, so it never appears in usage or spend.
    why: >-
      Change only to trade size against accuracy. The default (`ms-marco-MiniLM-L-6-v2`)
      is small and fast and is what the +20pp figure was measured with; a larger
      `ms-marco` variant scores better and costs more latency and memory per turn.
    manage: >-
      Must be a cross-encoder, not a bi-encoder or embedding model — an embedding model
      here will load and produce meaningless scores rather than fail loudly. Changing it
      triggers a fresh download on the next recall.

  recall_candidate_pool:
    summary: How many candidates the reranker gets to look at.
    what: >-
      The size of the shortlist stage 1 hands to stage 2. Deliberately much larger than
      the number of facts that end up in the prompt.
    how: >-
      The fused searches keep this many candidates; the cross-encoder scores all of them
      and the top-k survive. Reranking cost scales roughly linearly with this number.
    why: >-
      Raise it when the right fact exists but never reaches the prompt — a bigger pool
      gives the reranker a chance to find something the fast search ranked poorly. Lower
      it when recall is accurate but slow. Below about 20 the reranker has nothing to
      work with and the whole second stage stops earning its cost.
    manage: >-
      Pointless without `cross_encoder_enabled`. The default of 50 against a typical
      top-k of 5–10 is roughly a 5–10× over-fetch, which is the intended shape.

  recall_ce_max_demotion:
    summary: How far the reranker may push a candidate down — a hedge against its blind spots.
    what: >-
      A cap on the reranker's pessimism. It may promote a candidate as far as it likes,
      but it may only demote one this many positions below where fusion placed it.
    how: >-
      After scoring, each candidate's new rank is clamped so it cannot fall more than
      this many places relative to its fused rank. Promotion is unclamped.
    why: >-
      Cross-encoders are strong on average and occasionally confidently wrong — a fact
      the keyword *and* vector searches both ranked first should not vanish because one
      model disliked it. Raise it if you trust the encoder more than fusion; set it to 0
      to freeze fusion's order against any demotion at all.
    manage: >-
      Asymmetric by design; don't read it as a general "trust" dial. Values above ~5
      effectively remove the hedge, since few candidates move that far.

  # ── Hybrid search ───────────────────────────────────────────────────────
  recall_hybrid_bm25_weight:
    summary: How much keyword matching counts when fusing the two searches.
    what: The weight given to the BM25 (exact-token) ranking during fusion.
    how: Scales BM25's contribution to each candidate's fused score before ranking.
    why: >-
      Raise it when the memory is full of identifiers, error strings, code, or proper
      nouns — text where the exact token is the signal. Lower it for conversational
      memory, where the same idea is worded differently every time.
    manage: >-
      Read together with `recall_hybrid_vector_weight`; the two are usually kept summing
      to 1.0 (default 0.3 / 0.7, favouring meaning over tokens). Nothing enforces that
      sum — it is a convention that keeps the numbers interpretable.

  recall_hybrid_vector_weight:
    summary: How much semantic similarity counts when fusing the two searches.
    what: The weight given to the vector (meaning) ranking during fusion.
    how: Scales the vector ranking's contribution to each candidate's fused score.
    why: >-
      The default 0.7 favours meaning, which suits conversational memory where paraphrase
      is the norm. Lower it if the agent returns thematically-related but factually wrong
      material — that is vector search over-reaching.
    manage: Counterpart to `recall_hybrid_bm25_weight`; conventionally the two sum to 1.0.

  recall_hybrid_rrf_k:
    summary: How sharply top ranks are favoured when merging the two result lists.
    what: >-
      The Reciprocal Rank Fusion constant. Each list contributes 1/(k + rank), so k sets
      how steeply the reward falls off with position.
    how: >-
      Low k makes first place worth far more than third — fusion becomes winner-take-all.
      High k flattens the curve, so agreement across both lists matters more than being
      first in either.
    why: >-
      Rarely worth touching; 60 is the value the RRF literature settled on and what the
      defaults were tuned against. Lower it only if you want one strong signal to
      dominate; raise it to reward consensus.
    manage: >-
      Applies only when `recall_enable_hybrid` is on. Change it one step at a time and
      re-run `eval_recall` — the effect is real but not intuitive from the number alone.

  # ── Entity-centric ──────────────────────────────────────────────────────
  recall_entity_similarity_threshold:
    summary: How confident the match must be before a query is linked to a known entity.
    what: The minimum similarity for text in the query to be treated as naming an entity.
    how: >-
      Query terms are compared against known entity names; anything at or above this
      score is treated as a reference to that entity and its facts are pulled in.
    why: >-
      Raise it (towards 0.9) when the agent drags in facts about the wrong "Alex" or the
      wrong project — that is a threshold set too low. Lower it (towards 0.5) when
      entities are referred to loosely, by nickname or abbreviation, and are being missed.
    manage: >-
      The first dial to reach for on entity-recall problems, ahead of
      `recall_entity_max_entities` or graph depth. Below ~0.5 nearly everything matches
      something and the technique stops discriminating.

  recall_entity_max_entities:
    summary: How many entities one query may pull facts from.
    what: A ceiling on entity fan-out per recall.
    how: >-
      Matched entities are ranked by similarity and the top N are used. Everything below
      the cut is ignored regardless of score.
    why: >-
      Raise it for questions that legitimately span many things ("how do our services
      talk to each other"). Lower it to keep recall tight and the prompt focused — each
      extra entity brings its whole fact set.
    manage: >-
      Interacts multiplicatively with `recall_entity_graph_depth`: 5 entities at depth 2
      is a much wider sweep than the numbers suggest. Prefer raising this over raising
      depth.

  recall_entity_graph_depth:
    summary: How many relationship hops out from a matched entity to gather facts.
    what: >-
      The traversal radius in the entity graph. Depth 1 means the entity's own facts;
      depth 2 also means facts about everything it is directly related to.
    how: >-
      Facts are collected breadth-first from each matched entity out to this many hops.
      Because real graphs are densely connected, each additional hop multiplies rather
      than adds to the set.
    why: >-
      Keep it at 1 unless you have a specific reason. Depth 2 answers genuinely
      relational questions ("who else works on what she works on") and is the point where
      recall starts pulling in loosely-connected noise. Depth 3+ is rarely useful and
      reliably slow.
    manage: >-
      The most expensive dial in this section. If recall gets vague after raising it,
      that is the cause — lower it before adjusting anything else.

  # ── Query expansion ─────────────────────────────────────────────────────
  recall_expansion_max_variants:
    summary: How many alternative phrasings of the question to search with.
    what: The cap on generated query variants per recall.
    how: Each variant is searched separately and the results are merged and deduplicated.
    why: >-
      Raise it when facts are stored in wording consistently unlike how they're asked
      about. Lower it to cut per-turn search cost. Returns diminish quickly — the third
      variant rarely finds what the first two missed.
    manage: >-
      Every variant is another full search, so this multiplies retrieval cost directly.
      Inert unless `recall_enable_query_expansion` is on.

  # ── HyDE ────────────────────────────────────────────────────────────────
  recall_hyde_model:
    summary: The model that drafts the hypothetical answer. Empty follows the Fast Utility role.
    what: >-
      The small, fast model used to invent a plausible answer for HyDE to search with.
      Never writes anything the user sees.
    how: >-
      Called once per recall when HyDE is enabled. Left empty, it follows the Fast Utility
      model role, so changing that role updates this and every other utility call at once.
    why: >-
      Pin a model only when you need this specific step to differ from every other utility
      call. Quality matters far less than usual here — the draft is thrown away after
      embedding, so pick the cheapest, fastest thing that writes a coherent sentence.
    manage: >-
      Prefer leaving it empty and setting the Fast Utility role instead. A slow model here
      is felt on *every* recall, not just hard ones.

  recall_hyde_temperature:
    summary: How varied the hypothetical answer is allowed to be.
    what: Sampling temperature for the HyDE draft.
    how: Higher values produce more varied drafts, which move the embedded query further afield.
    why: >-
      The default 0.7 is deliberately loose — some variation helps the draft land near
      differently-worded real answers. Lower it towards 0.2 if HyDE is dragging in
      off-topic material; raise it if it keeps producing the same narrow phrasing and
      missing paraphrased facts.
    manage: Only affects retrieval. It can never affect what the agent actually says.

  recall_hyde_max_tokens:
    summary: Length cap on the hypothetical answer.
    what: The token ceiling for the drafted answer before it is embedded.
    how: >-
      Generation stops here. Because the text is embedded as a whole, a longer draft
      dilutes the query's focus as much as it enriches it.
    why: >-
      150 is the sweet spot: enough for a couple of sentences with the right shape and
      vocabulary. Raise it only for genuinely multi-part questions. Larger drafts cost
      more latency on every single recall and typically retrieve *worse*.
    manage: >-
      If you find yourself raising this a lot, the real problem is usually a query that
      should have been split, not a draft that should be longer.

  # ── Self-query ──────────────────────────────────────────────────────────
  recall_self_query_model:
    summary: The model that extracts filters from the question. Empty follows the Fast Utility role.
    what: The small model that reads dates, names, and keywords out of natural language.
    how: >-
      Called once per recall when self-query is enabled, and asked for structured output.
      Left empty, it follows the Fast Utility model role.
    why: >-
      Pin one only if the role's model is unreliable at structured extraction. This is a
      parsing job, not a reasoning job — a capable small model is the right choice.
    manage: >-
      Prefer leaving it empty and setting the Fast Utility role. A model that returns
      malformed filters degrades quietly: recall simply proceeds unfiltered.

  recall_self_query_temperature:
    summary: How deterministic filter extraction is. Keep it low.
    what: Sampling temperature for the extraction call.
    how: Low values make the same question yield the same filters every time.
    why: >-
      0.2 is right, and there is little reason to raise it. Creativity in extraction means
      invented constraints — a date range nobody asked for — which silently excludes the
      correct answer and looks like a memory failure.
    manage: If self-query produces odd filters, lower this before changing the model.

  recall_self_query_max_tokens:
    summary: Length cap on the extracted filter set.
    what: The token ceiling for the structured filter output.
    how: Generation stops here; a truncated filter set is discarded rather than half-applied.
    why: >-
      200 comfortably fits a normal filter set. Raise it only if you see extraction being
      cut off on complex multi-constraint questions.
    manage: Rarely the cause of a recall problem. Check the model and temperature first.

  # ── Cross-technique tuning ──────────────────────────────────────────────
  recall_min_confidence:
    summary: The score a fact must reach before it may enter the prompt at all.
    what: >-
      A floor applied after all techniques and reranking have run. Anything below it is
      dropped rather than ranked.
    how: Final scores are compared against this value; failures are discarded before top-k.
    why: >-
      Raise it when the agent cites weakly-related memories — a hard floor is more
      predictable than tuning individual techniques. Lower it when you know a fact is
      stored and it still never appears. Set too high, recall goes silent and the agent
      looks amnesiac.
    manage: >-
      Applies across every technique, so it is the bluntest instrument here. Move it in
      0.05 steps and re-run `eval_recall`; large jumps make retrieval hard to reason about.

  # ── Experimental ────────────────────────────────────────────────────────
  recall_first_person_guard:
    summary: Penalise facts whose subject is ambiguous between the user and the agent.
    what: >-
      An experimental attribution guard. It down-weights facts where "I" or "my" makes it
      unclear whether the statement is about the user or about the agent itself.
    how: >-
      Candidates with ambiguous first-person attribution have their score reduced by
      `recall_first_person_penalty` before ranking.
    why: >-
      Off by default, and it should stay off unless you are specifically investigating
      attribution errors. It failed its abstention gate in evaluation — it suppressed
      correctly-attributed facts alongside ambiguous ones. See Memory-Roadmap §2.11.
    manage: >-
      Experimental. Turning it on will change recall in ways the golden set does not model,
      so re-run `eval_recall` before and after and compare rather than trusting the feel.

  recall_first_person_penalty:
    summary: How hard the attribution guard penalises an ambiguous fact.
    what: The score reduction applied to first-person-ambiguous candidates.
    how: Subtracted from the candidate's score before ranking; 1.0 is effectively exclusion.
    why: >-
      Only meaningful with `recall_first_person_guard` on. Lower values de-prioritise
      ambiguous facts while keeping them reachable; higher values remove them from
      consideration entirely.
    manage: >-
      Inert while the guard is off. Given the guard's evaluation history, prefer a gentle
      value (~0.3) over exclusion if you enable it at all.

# ---------------------------------------------------------------------------
# config store — dotted paths into data/config.json
# ---------------------------------------------------------------------------

  # ══ Consolidation ══════════════════════════════════════════════════════
  # The background pipeline that reads finished turns and keeps what matters.

  feature_default_model:
    summary: One model for every memory stage, unless a stage says otherwise.
    what: >-
      A bulk default sitting between the individual stage models and the global
      default. Every stage below left on `inherit` resolves through here.
    how: >-
      The chain is: the stage's own setting → this → the default chat model. Set
      this and all of memory moves at once; override individual stages only where
      you want something different.
    why: >-
      The single most useful setting on this screen. Memory work is high-volume
      and mostly mechanical, so pointing it all at one cheap, fast model is
      usually right — and doing it here is one edit instead of nine.
    manage: >-
      Empty means each stage falls through to its role or the default chat model.
      Note that not every stage inherits the same way: most follow **Fast
      Utility**, combined extraction follows **Deep Reasoning** because quality
      there is worth more, and procedural distillation follows this setting.

  # ── Extraction ─────────────────────────────────────────────────────────
  extraction_enabled:
    summary: Whether finished conversations become memory at all.
    what: >-
      The stage that reads completed turns and pulls out facts, entities and the
      relationships between them.
    how: >-
      Runs in the background on a schedule, not during your turn — nothing here
      slows a conversation down. By default it works over *windows* of several
      turns at once, so a person mentioned across three messages resolves to one
      entity rather than three.
    why: >-
      Leave it on; with it off, memory only ever contains what you stored by hand
      and recall has nothing to find. Turn it off to stop accumulating new memory
      without deleting what is already there — useful while diagnosing whether
      bad recall is a storage problem or a retrieval one.
    manage: >-
      This is the head of the pipeline: with it off, contradiction detection,
      correction handling and entity linking have no new material to work on.

  extraction_model:
    summary: Which model reads conversations and pulls out the facts.
    what: >-
      The model used for the extraction pass — a structured reading task, not a
      creative one.
    how: >-
      `inherit` follows the chain: the bulk default above, then the **Fast
      Utility** role, then the default chat model. Fresh installs leave it on
      `inherit` so the role drives memory rather than a model chosen years ago.
    why: >-
      Extraction quality is what everything downstream inherits: a fact recorded
      wrongly is retrieved wrongly forever. Point it at a stronger model if you
      find memory storing things you did not say; point it cheaper if volume is
      the concern and quality is already fine.
    manage: >-
      An existing install keeps whatever model it saved. **Adopt roles for all
      stages** clears concrete overrides back to `inherit` in one action, which
      is usually what you want after setting up model roles.

  extraction_temperature:
    summary: How literally the extractor reads.
    what: >-
      Sampling temperature for the extraction call.
    how: >-
      Low values keep extraction close to what was actually said; higher values
      let the model paraphrase and infer more freely.
    why: >-
      Keep it low. This is a reading task, and creativity here means invented
      facts — the most expensive kind of error memory can make, because nothing
      downstream can tell an invented fact from a real one.
    manage: >-
      Default 0.2. If memory contains plausible-sounding things nobody said, this
      is the first place to look, before the prompt or the model.

  extraction_max_tokens:
    summary: How much extracted material one pass may return.
    what: >-
      The output budget for a single extraction call.
    how: >-
      Extraction returns structured output; a budget too small truncates it,
      which loses whatever came last rather than failing outright.
    why: >-
      Raise it if dense conversations seem to lose their tail — the later facts
      in a long window are the ones that go missing. Lower it only to control
      cost on an expensive extraction model.
    manage: >-
      Default 2000, sized for the shipped window. Reasoning models need
      noticeably more, since their thinking comes out of the same budget.

  extraction_condense_facts:
    summary: Store atomic facts rather than whole sentences.
    what: >-
      A post-step that reduces verbose statements to single, self-contained
      facts.
    how: >-
      "I think I mentioned that my sister Anna lives in Berlin now" becomes the
      fact rather than the sentence. Atomic facts retrieve better because each
      one matches on its own terms instead of being buried in context.
    why: >-
      Leave it on. Retrieval works on units of meaning; a paragraph stored whole
      matches poorly and returns a lot of irrelevant text when it does match.
      Turn it off only if you specifically want the original phrasing preserved.
    manage: >-
      Condensing loses hedging and tone. If you rely on memory recording *how*
      something was said rather than what, this is the setting that removes it.

  # ── Relevance filter ───────────────────────────────────────────────────
  relevance_filter_enabled:
    summary: Skip turns that contain nothing worth remembering.
    what: >-
      A cheap gate in front of extraction that answers one question: is there
      anything in this turn worth storing?
    how: >-
      A short yes/no call per turn. "Thanks", "ok", "try again" are filtered out
      before the much more expensive extraction pass ever runs.
    why: >-
      Leave it on. Most turns in a real conversation carry nothing memorable, and
      this is what stops you paying extraction prices to discover that. Turning
      it off does not improve memory — it just extracts from turns that have
      nothing in them.
    manage: >-
      If it is filtering out turns you wanted stored, raise the extraction
      model's quality before disabling the gate: a filter that is wrong is
      usually a filter running on too weak a model.

  relevance_filter_model:
    summary: Which model decides whether a turn is worth extracting.
    what: >-
      The model used for the relevance gate — a binary judgement.
    how: >-
      `inherit` follows the bulk default, then the **Fast Utility** role. This is
      the highest-volume call in the whole memory system: it runs on every turn,
      where extraction runs only on the ones that pass.
    why: >-
      Use the cheapest model that answers correctly. Because it runs on
      everything, a model choice here costs more in aggregate than anywhere else
      on this screen.
    manage: >-
      A model too weak to make the call reliably is worse than no filter, since
      it silently drops turns you wanted. If memory is missing obvious things,
      test by disabling the filter briefly rather than by guessing.

  relevance_filter_temperature:
    summary: How consistent the yes/no judgement is.
    what: >-
      Sampling temperature for the relevance gate.
    how: >-
      Near zero makes the same turn get the same verdict every time; higher
      values make the gate inconsistent between otherwise identical turns.
    why: >-
      Keep it at or near the default. There is no upside to a creative yes/no —
      the only effect of raising it is that the same kind of message is
      sometimes stored and sometimes not.
    manage: >-
      Default 0.1, the lowest on this screen, deliberately.

  relevance_filter_max_tokens:
    summary: How much room the gate has to answer.
    what: >-
      The output budget for the relevance call.
    how: >-
      The answer itself is a word, but a reasoning model spends tokens thinking
      before it gets there — and a reply truncated mid-thought is a lost verdict,
      not a fast one.
    why: >-
      Raise it if you have pointed the filter at a reasoning model and turns are
      being dropped erratically. Otherwise leave it: the extra budget costs
      nothing when it goes unused.
    manage: >-
      Default 500, which looks generous for a yes/no and is not — that headroom
      exists precisely for reasoning models.

  # ── Contradiction detection ────────────────────────────────────────────
  contradiction_detection_enabled:
    summary: Notice when a new fact conflicts with one already stored.
    what: >-
      A check that runs as facts are written: does this contradict something
      memory already believes?
    how: >-
      Three layers, cheapest first. A fast gate discards near-identical
      duplicates; a semantic search pulls a handful of possibly-conflicting
      facts; only then does an LLM judge whether there is a real contradiction.
      Most new facts never reach the third layer.
    why: >-
      Leave it on. Without it, memory accumulates both "she drives a Volvo" and
      "she drives a Škoda" and retrieval will happily return either, with no
      indication that one superseded the other. That failure is invisible until
      it produces a confidently wrong answer.
    manage: >-
      Costs an LLM call only for facts that survive the first two layers, so the
      typical per-fact cost is far below what a per-fact LLM check would imply.

  contradiction_model:
    summary: Which model judges whether two facts really conflict.
    what: >-
      The model used for the third and final layer of contradiction detection.
    how: >-
      `inherit` follows the bulk default, then the **Fast Utility** role. It only
      sees candidates the cheaper layers could not resolve.
    why: >-
      Worth a capable model precisely because it runs rarely. Deciding that "lives
      in Berlin" and "moved to Munich" conflict, while "likes coffee" and "drinks
      tea" do not, is a genuine judgement.
    manage: >-
      If memory is flagging contradictions between facts that are merely
      different, this model — not the thresholds — is usually the cause.

  contradiction_temperature:
    summary: How consistent the contradiction judgement is.
    what: >-
      Sampling temperature for the contradiction call.
    how: >-
      Low values make the same pair of facts get the same verdict each time.
    why: >-
      Keep it low. An inconsistent verdict here means the same conflict is
      sometimes resolved and sometimes left in memory, which is worse than either
      behaviour applied consistently.
    manage: >-
      Default 0.2, matching the other judgement stages.

  contradiction_max_tokens:
    summary: How much room the contradiction judgement has.
    what: >-
      The output budget for the contradiction call.
    how: >-
      As with the relevance gate, the verdict is short but a reasoning model
      needs room to reach it.
    why: >-
      Raise it if contradictions are going undetected on a reasoning model.
      Otherwise leave it alone.
    manage: >-
      Default 500. Unused budget costs nothing.

  semantic_duplicate_threshold:
    summary: How similar two facts must be to count as the same fact.
    what: >-
      The first and cheapest layer of contradiction detection: a similarity bar
      above which a new fact is treated as a duplicate of an existing one rather
      than as something new.
    how: >-
      Compared as cosine similarity between the two facts' embeddings, with no
      LLM involved. Above the bar, the new fact reinforces the old one instead of
      being stored again.
    why: >-
      Lower it if memory fills with near-identical restatements of the same
      thing. Raise it if genuinely different facts are being collapsed together —
      which shows up as memory "forgetting" the more specific of two similar
      statements.
    manage: >-
      Default 0.92, deliberately high: at this bar only near-verbatim repeats
      merge. Below about 0.85 you begin merging facts that differ in ways that
      matter.

  contradiction_similarity_threshold:
    summary: How related a stored fact must be to be checked for conflict.
    what: >-
      The second layer: how wide a net to cast when searching for facts that
      might contradict a new one.
    how: >-
      Stored facts above this similarity become candidates for the LLM judgement.
      A lower bar means more candidates, which means more of the expensive third
      layer runs.
    why: >-
      Raise it to cut contradiction-checking cost, accepting that conflicts
      between loosely-worded facts get missed. Lower it if you know contradictions
      are slipping through — the pair that conflicts may simply not be similar
      enough in wording to have been compared.
    manage: >-
      Default 0.5, much lower than the duplicate bar, because contradicting facts
      often share little vocabulary — "she moved to Munich" and "lives in Berlin"
      conflict without sounding alike.

  contradiction_max_candidates:
    summary: How many possible conflicts are judged per new fact.
    what: >-
      A cap on the candidates from the semantic search that reach the LLM.
    how: >-
      Candidates are taken in similarity order, so the cap drops the least
      similar. It bounds the worst-case cost of storing one fact.
    why: >-
      Raise it when memory is large and contradictions are being missed because
      the real conflict ranked eleventh. Lower it to bound cost on a busy install.
    manage: >-
      Default 10. This multiplies against the contradiction model's price on
      every fact that reaches layer three, so it is the main cost lever here.

  link_autocreate_stub_entities:
    summary: Create a placeholder rather than orphan a fact about an unknown thing.
    what: >-
      What happens when a fact mentions something memory has never heard of: a
      minimal placeholder entity is created so the fact has somewhere to attach.
    how: >-
      Off, the fact is dropped unless an existing entity can be recovered — it is
      still counted in the metrics, but it is not stored.
    why: >-
      Leave it on. A fact about a person the system has not met yet is exactly
      the kind of thing worth remembering, and the placeholder fills in the first
      time that name appears properly.
    manage: >-
      Turning it off keeps the entity graph tidier at the cost of losing early
      facts about anything new — usually the wrong trade for a memory system.

  # ── Correction handling ────────────────────────────────────────────────
  correction_detection_enabled:
    summary: Catch "actually, I meant…" and fix what was stored.
    what: >-
      Detection of implicit corrections: you restating something you said
      earlier, differently.
    how: >-
      Runs at extraction time, so a correction in the same conversation is caught
      as the conversation is consolidated rather than surfacing later as a
      contradiction between two stored facts.
    why: >-
      Leave it on. Without it, "no, her birthday is in March" becomes a *second*
      fact rather than a replacement, and both are retrievable. Contradiction
      detection would eventually notice, but only after both are already stored.
    manage: >-
      This and contradiction detection cover the same failure from two sides:
      this one catches corrections as they happen, that one catches conflicts
      that got through. Both on is the intended state.

  correction_model:
    summary: Which model spots a correction.
    what: >-
      The model used to decide whether a statement corrects an earlier one.
    how: >-
      `inherit` follows the bulk default, then the **Fast Utility** role.
    why: >-
      A cheap model is usually fine — corrections are linguistically marked
      ("actually", "no", "I meant") and easy to spot. Raise it only if implicit
      corrections without those markers are being missed.
    manage: >-
      Shares its shape with the other judgement stages; if you are setting one of
      them explicitly, set them together or use the bulk default.

  correction_temperature:
    summary: How consistent correction detection is.
    what: >-
      Sampling temperature for the correction call.
    how: >-
      Low values keep the same phrasing getting the same verdict.
    why: >-
      Keep it low, for the same reason as the other judgement stages: an
      inconsistent verdict means the same correction is sometimes applied and
      sometimes not.
    manage: >-
      Default 0.2.

  correction_max_tokens:
    summary: How much room correction detection has to answer.
    what: >-
      The output budget for the correction call.
    how: >-
      Short answer, but reasoning models need room to reach it.
    why: >-
      Raise it only if corrections are being missed on a reasoning model.
    manage: >-
      Default 500.

  # ── Combined relevance + extraction ────────────────────────────────────
  combined_extraction_model:
    summary: Which model runs relevance and extraction as one call.
    what: >-
      A merged path that answers "is this worth storing" and "what is in it" in a
      single call rather than two.
    how: >-
      `inherit` follows the bulk default, then the **Deep Reasoning** role — the
      only memory stage that does, because doing both jobs at once is harder than
      either alone and quality here pays for itself.
    why: >-
      Combining cuts memory's LLM calls by roughly three quarters, which is the
      single largest saving in the system. That is worth a better model than the
      individual stages would need.
    manage: >-
      This is the reason memory's cost does not scale the way the stage list
      suggests. If you point it at a weak model to save money you may lose more
      to bad extraction than you save on the call.

  combined_extraction_temperature:
    summary: How literally the combined pass reads.
    what: >-
      Sampling temperature for the merged relevance-plus-extraction call.
    how: >-
      Slightly above the plain extraction default, because the combined call is
      doing a judgement as well as a reading.
    why: >-
      Keep it low. The same rule applies as for extraction: creativity here means
      facts nobody stated.
    manage: >-
      Default 0.3, against extraction's 0.2 — a deliberate difference, not drift.

  combined_extraction_max_tokens:
    summary: How much the combined pass may return.
    what: >-
      The output budget for the merged call.
    how: >-
      It carries both the relevance verdict and the extracted facts, so it needs
      at least what extraction alone would.
    why: >-
      Raise it if dense windows lose their later facts. Lower it only to control
      cost, accepting truncation.
    manage: >-
      Default 2000, matching plain extraction.

  # ── Procedural distillation ────────────────────────────────────────────
  procedural_distill_model:
    summary: Which model turns repeated behaviour into a stated rule.
    what: >-
      The model that reads accumulated candidates — things that keep happening —
      and distils them into procedures: durable "how we work" rules.
    how: >-
      `inherit` follows the bulk default, then the global default. Runs as a
      background job, never inside a turn.
    why: >-
      This is the stage that turns memory from a record into a habit. A stronger
      model writes rules that generalise; a weaker one writes rules that restate
      one incident.
    manage: >-
      Distillation is infrequent and batched, so a better model here costs
      little in aggregate — a rare case on this screen where quality is nearly
      free.

  procedural_distill_temperature:
    summary: How much latitude the rule-writer has.
    what: >-
      Sampling temperature for the distillation call.
    how: >-
      Low values keep procedures close to the observed behaviour; higher values
      let the model generalise further from it.
    why: >-
      Keep it low. An over-generalised procedure is worse than none — it rides in
      every prompt, so a wrong rule is wrong continuously rather than once.
    manage: >-
      Default 0.2.

  procedural_distill_max_tokens:
    summary: How long the distilled procedures may be.
    what: >-
      The output budget for one distillation run.
    how: >-
      A run produces several procedures at once, so the budget is shared across
      them.
    why: >-
      Raise it if procedures arrive truncated. Lower it to force terser rules —
      which is not a bad outcome, since procedures are injected into prompts and
      short ones cost less on every turn thereafter.
    manage: >-
      Default 1000. Remember that what is written here is paid for again on every
      turn that carries it.

  procedural_distill_timeout_s:
    summary: How long a distillation run may hang before it is abandoned.
    what: >-
      A wall-clock cap on the distillation LLM call.
    how: >-
      Bounds the background job so an unresponsive provider cannot stall it
      indefinitely. On timeout the run ends and its candidates stay pending for
      the next one — nothing is lost.
    why: >-
      Raise it if you have pointed distillation at a slow model and runs are
      timing out. There is little reason to lower it: this is a background job,
      so its latency costs you nothing directly.
    manage: >-
      Default 90 seconds. Since candidates survive a timeout, the failure mode is
      "procedures appear later", not "procedures are lost".

  procedural_dedupe_threshold:
    summary: How similar a new procedure must be to reinforce an old one instead.
    what: >-
      The bar above which a distilled procedure is treated as the same rule you
      already have, and strengthens it rather than joining it.
    how: >-
      Cosine similarity between the new procedure and existing ones. Above the
      bar, the existing procedure is reinforced; below, a new one is created.
    why: >-
      Lower it if you accumulate several procedures that say the same thing in
      different words — each one costs prompt space on every turn. Raise it if
      genuinely distinct rules are being merged into one vague rule.
    manage: >-
      Default 0.85, lower than the fact duplicate bar, because two procedures can
      mean the same thing while sharing little wording.

  procedural_distill_batch_limit:
    summary: How many pending candidates one distillation run may chew through.
    what: >-
      A cap on candidates processed per run, bounding how long a single run takes
      and how much it costs.
    how: >-
      Excess candidates stay pending and are picked up by the next run, so a
      backlog drains over several runs rather than in one expensive pass.
    why: >-
      Raise it to clear a large backlog faster — useful after enabling
      distillation on an install with a lot of history. Lower it to keep any
      single run small and predictable.
    manage: >-
      Default 100. Read together with the run interval below: the two decide how
      quickly a backlog clears.

  # ── Always-on cores ────────────────────────────────────────────────────
  reflex_core_enabled:
    summary: Put the most important procedures in every prompt.
    what: >-
      A small set of distilled procedures injected into the system prompt on
      every turn, rather than retrieved when they happen to match.
    how: >-
      Maintained, not searched: the core is chosen in the background and simply
      *is there*, so a rule about how you like work done applies even when
      nothing in your message would have retrieved it.
    why: >-
      Leave it on. Rules about working style are precisely the ones that never
      match a query — you do not ask about them, you expect them to be followed.
      Retrieval cannot deliver that; only always-on can.
    manage: >-
      Everything in the core costs prompt tokens on every turn. That is the trade:
      reliability for a small permanent overhead.

  reflex_core_limit:
    summary: How many procedures ride in every prompt.
    what: >-
      The size of the always-on procedure set.
    how: >-
      The highest-ranked procedures fill the slots; the rest remain retrievable
      but not automatic.
    why: >-
      Raise it if the agent follows your stated preferences inconsistently — the
      relevant rule may simply be outside the core. Lower it to reclaim prompt
      space; 0 disables the core without disabling distillation.
    manage: >-
      Default 5. This is a per-turn cost on every conversation, so a large
      number here is one of the few settings that quietly raises the price of
      everything.

  salient_core_enabled:
    summary: Put the most important *facts* in every prompt.
    what: >-
      The fact-and-entity counterpart to the reflex core: a small set of
      high-salience items always present rather than retrieved.
    how: >-
      Also maintained rather than searched. These are the things it would be
      absurd for the agent to have to look up — who you are, what you are working
      on — rather than things it might need.
    why: >-
      Leave it on. It is what stops the agent needing a successful retrieval
      before it can behave as though it knows you.
    manage: >-
      As with the reflex core, everything here is paid for on every turn.

  salient_core_limit:
    summary: How many facts ride in every prompt.
    what: >-
      The size of the always-on fact set.
    how: >-
      Filled by salience, highest first.
    why: >-
      Raise it if the agent keeps failing to recall things that ought to be
      obvious about you. Lower it, or set 0, to reclaim per-turn prompt space.
    manage: >-
      Default 8, capped at 10 to match the renderer's own limit — values above
      that would be silently ignored, so the cap is honest rather than arbitrary.

  salient_core_min_salience:
    summary: How important a fact must be to earn a permanent slot.
    what: >-
      A floor on salience for inclusion in the always-on set.
    how: >-
      Facts below the bar are excluded even when slots are free, so a thin
      memory does not pad the core with trivia.
    why: >-
      Raise it if the core is filling with things that are true but unimportant.
      Lower it on a young install where nothing has accumulated enough salience
      to qualify and the core sits empty.
    manage: >-
      Default 0.6. Salience grows with reinforcement, so an empty core on a new
      install is expected and usually resolves itself rather than needing this
      lowered.

  # ── Entity linking (backfill) ──────────────────────────────────────────
  entity_linking_enabled:
    summary: Reconnect facts to the entities they are about, after the fact.
    what: >-
      A background pass that finds facts whose subject was never linked to a real
      entity and attaches them where they belong.
    how: >-
      Runs after consolidation, over history rather than just new material —
      which is how a person first mentioned in passing months ago gets their
      earlier facts attached once the system properly knows who they are.
    why: >-
      Leave it on. Entity-centric recall — the technique that answers "what do we
      know about X" — can only return facts that are actually attached to X. An
      orphaned fact is invisible to it however true it is.
    manage: >-
      This is the repair pass, not the write path: facts are linked at write time
      too. It exists because write-time linking cannot know about an entity that
      does not exist yet.

  entity_linking_similarity_threshold:
    summary: How confident a match must be before it is even considered.
    what: >-
      The lower bound of the band in which a possible entity match is *recorded*
      but never acted on automatically.
    how: >-
      Matches at or above this bar, but below the separate auto-merge bar, are
      **logged only** — a grey zone kept as evidence for later adjudication,
      deliberately not merged. Below this bar, nothing is recorded at all.
    why: >-
      Lower it to widen the grey zone and gather more borderline cases; raise it
      to keep the log clean. Neither direction causes a merge on its own, which
      is what makes this safe to move.
    manage: >-
      Default 0.75. The important property: this setting cannot cause two
      entities to be wrongly merged, because everything in its band is
      observation rather than action.

  entity_linking_use_llm_disambiguation:
    summary: Ask a model when the name is genuinely ambiguous.
    what: >-
      Whether ambiguous matches — two plausible entities with the same name —
      get an LLM judgement rather than being left alone.
    how: >-
      Off by default. On, ambiguous cases cost a model call each during the
      backfill run.
    why: >-
      Turn it on if you accumulate people or projects with similar names and
      facts keep landing on the wrong one. It ships off because the failure it
      prevents is rarer than the cost it adds on a large history.
    manage: >-
      Cost scales with how ambiguous your entity graph is, not with its size — an
      install with distinctive names will barely notice it.

  entity_linking_model:
    summary: Which model resolves ambiguous entity matches.
    what: >-
      The model used when LLM disambiguation is on.
    how: >-
      `inherit` follows the bulk default, then the **Fast Utility** role. It does
      nothing unless disambiguation is enabled above.
    why: >-
      Set it only if you have turned disambiguation on and it is choosing wrongly.
      Distinguishing two people with the same name from context is a real
      judgement and rewards a better model.
    manage: >-
      Leaving disambiguation off makes this setting inert — worth checking before
      concluding that a model change here did nothing.

  entity_linking_max_facts:
    summary: How many orphaned facts one backfill run may examine.
    what: >-
      A cap on the facts scanned per run, bounding both time and memory use.
    how: >-
      The run stops at the cap; the remainder is picked up next time, so a large
      backlog drains across several runs.
    why: >-
      Raise it to clear a big history faster — most relevant just after enabling
      linking on an install with a lot of accumulated memory. Lower it if the
      backfill job is competing for resources with live work.
    manage: >-
      Default 5000. Read together with the run interval below: the two decide how
      long a backlog takes to clear.

  entity_linking_max_ngram:
    summary: The longest entity name, in words, the matcher will look for.
    what: >-
      How many consecutive words are considered as a possible entity name when
      scanning a fact's text.
    how: >-
      The matcher tries spans up to this length. Longer spans mean more
      combinations to check on every fact.
    why: >-
      Raise it if you work with long proper names — organisations, product lines,
      paper titles — that are being missed because they exceed the span. Lower it
      to speed up scanning where names are short.
    manage: >-
      Default 4 words, which covers most personal and product names. The cost
      grows with the setting on every fact scanned, so raise it deliberately.

  # ── Quality thresholds ─────────────────────────────────────────────────
  fact_confidence_threshold:
    summary: How sure the extractor must be before a fact is kept.
    what: >-
      The confidence floor a newly extracted fact must clear to be stored at all.
    how: >-
      Extraction assigns each fact a calibrated confidence by how it was
      expressed: roughly 0.95 for something you stated outright, 0.85 for
      something strongly implied, 0.70 for a reasonable inference, and 0.50 for
      anything hedged or ambiguous.
    why: >-
      Those numbers make the setting concrete. At the default of 0.7 memory keeps
      inferences but drops guesses. Raise it toward 0.85 to store only what was
      implied or said — a much stricter memory that forgets more. Lower it toward
      0.5 to keep the guesses too, and accept that some of them are wrong.
    manage: >-
      The single most consequential number on this screen: it decides what memory
      contains, and everything downstream can only work with what got past it.

  promotion_min_confidence:
    summary: How sure a fact must be before it can travel between channels.
    what: >-
      The bar for promoting a fact out of the channel it was learned in, so other
      conversations can see it.
    how: >-
      Higher than the storage bar, because a fact crossing channels is asserted
      in contexts nobody checked it against.
    why: >-
      Raise it if things learned in one project are turning up wrongly in
      another. Lower it if useful knowledge stays trapped in the conversation
      that produced it.
    manage: >-
      Default 0.85 against storage's 0.7 — a deliberate gap. Confidence is only
      one of the promotion conditions; access count and how many conversations a
      fact appears in also apply.

  # ── Job intervals ──────────────────────────────────────────────────────
  job_consolidate_interval:
    summary: How often finished conversations are turned into memory.
    what: >-
      The gap between consolidation sweeps, in minutes.
    how: >-
      Each sweep picks up turns not yet consolidated and marks them as it goes,
      so runs never redo work and a sweep that finds nothing new costs nothing.
      Recent conversations are consolidated incrementally, which is why a sweep
      may process only a turn or two.
    why: >-
      Shorten it if you want something said now to be recallable in the next
      conversation a few minutes later. Lengthen it to batch more turns per run,
      which is slightly cheaper because extraction windows fill better.
    manage: >-
      Default 15 minutes. If memory seems not to be updating, check this interval
      before suspecting extraction — the most common answer is that the sweep has
      simply not run yet.

  job_promote_interval:
    summary: How often facts are considered for promotion between channels.
    what: >-
      The gap between promotion passes, in minutes.
    how: >-
      Each pass looks for facts that now meet the promotion conditions and lifts
      them so other conversations can see them.
    why: >-
      Shorten it if knowledge should spread between projects quickly. Lengthen it
      on an install where channels are meant to stay largely separate — a slower
      pass is a softer boundary than turning promotion off entirely.
    manage: >-
      Default 60 minutes. Promotion depends on repeated access, so a fact usually
      needs several passes to qualify regardless of how often they run.

  job_entity_linking_interval:
    summary: How often orphaned facts are reconnected to entities.
    what: >-
      The gap between entity-linking backfill runs, in minutes.
    how: >-
      Scheduled to follow consolidation, so newly extracted facts get their
      linking pass shortly after being written.
    why: >-
      Shorten it while clearing a backlog after enabling linking. Lengthen it once
      memory is steady — on an install with little new material, most runs find
      nothing to do.
    manage: >-
      Default 30 minutes, twice the consolidation interval. Read with the
      per-run fact cap: interval times cap is how fast a backlog drains.

  job_distill_procedures_interval:
    summary: How often repeated behaviour is distilled into procedures.
    what: >-
      The gap between procedural distillation runs, in minutes.
    how: >-
      Each run takes up to the batch limit of pending candidates and turns them
      into procedures.
    why: >-
      Shorten it to make the agent pick up working habits faster — useful early
      on, when there is a backlog and nothing has been distilled yet. Lengthen it
      once procedures are stable; distillation is the least urgent of the jobs.
    manage: >-
      Default 30 minutes. Procedures need repeated evidence before they are
      distilled at all, so running this more often does not by itself produce
      more of them.

  # ── Consolidation prompts (edited on Prompts → Feature Prompts) ────────
  extraction_system_prompt:
    summary: Replace the built-in instruction the extractor works from.
    what: >-
      The prompt that tells extraction what counts as a fact worth keeping, how
      to phrase it, and how to attribute it. Empty uses the shipped prompt, which
      is the normal state.
    how: >-
      An override replaces the built-in prompt entirely rather than adding to it,
      so anything the shipped prompt established — the output structure, the
      confidence calibration, the attribution rules — has to be restated or it is
      simply gone.
    why: >-
      The last thing to reach for, not the first. If extraction is storing the
      wrong things, the model and the temperature are far more often the cause.
      A domain with genuinely unusual notions of what is worth remembering is the
      case that justifies an override.
    manage: >-
      Edited on **Prompts → Feature Prompts**, which shows a diff against the
      shipped prompt. Leaving it empty means extraction improves when the default
      does; an override opts out of that permanently.

  relevance_filter_prompt:
    summary: Replace the built-in instruction the relevance gate works from.
    what: >-
      The prompt behind the yes/no judgement on whether a turn is worth
      extracting. Empty uses the shipped prompt.
    how: >-
      As with extraction, an override replaces rather than extends — including
      the part that makes the answer parseable, so a rewrite that changes the
      output format silently breaks the gate.
    why: >-
      Worth touching when your conversations carry value the default definition
      of "worth remembering" misses — a domain where short confirmations are
      meaningful, say. Otherwise leave it: this prompt runs on every turn, so a
      subtly worse one is a cost paid continuously.
    manage: >-
      Edited on **Prompts → Feature Prompts** with a diff against the default.
      Test any override by watching whether turns you expect to be stored still
      are — a broken gate fails quietly, by dropping things.

config:
  # --- Verbatim window & compaction (Settings → Memory → Conversation Context)
  context.verbatim_budget_ratio:
    summary: How much of the model's context window the word-for-word transcript may fill.
    what: >-
      The ceiling on the verbatim window — the stretch of recent conversation the model
      sees exactly as it happened, rather than as a summary.
    how: >-
      Each turn is sized against the model's *real* context window, not a fixed number.
      Turns are kept verbatim until they would exceed this fraction of it; older ones
      fold into the conversation-state digest. Assembly still hard-caps at
      window − reserved output, so this can never squeeze out the reply.
    why: >-
      Lower it to leave room for a long answer, or if you are paying per token and would
      rather summarise sooner. Raise it to keep more exact wording in view — worth it
      when detail matters more than cost. It was 0.7 and is now 0.9 deliberately:
      compressing at 70% of a large window discarded detail long before anything was
      actually short of room.
    manage: >-
      With a correct window configured (Model Limits), most conversations never compact
      at all. If yours compact constantly, check the model's declared window before
      touching this — an understated window is the usual cause.

  context.summary_trigger_ratio:
    summary: When to prepare the digest, ahead of actually needing it.
    what: >-
      The point at which compaction runs *after* a turn, so the digest is already fresh
      the next time older turns need to leave the verbatim window.
    how: >-
      Measured against the turn's real history budget (input budget minus granted
      preamble blocks). Crossing it schedules a post-turn pre-warm that folds the oldest
      turns into the digest.
    why: >-
      Keep it slightly below the verbatim budget — that gap is the whole point. Pre-warm
      does the summarising between turns, where you don't feel it; if this sits at or
      above the verbatim ceiling, the work lands in the middle of a turn instead and you
      wait for it.
    manage: >-
      Default 0.85 against a 0.9 verbatim budget. Move the two together and keep the
      gap; closing it doesn't save anything, it only changes when you notice the cost.

  context.recent_floor:
    summary: How many recent turns are never summarised, whatever the pressure.
    what: The number of most-recent turns that always stay word-for-word.
    how: >-
      Compaction works from the oldest turn forward and stops here. Even a conversation
      well over budget keeps this many exchanges intact.
    why: >-
      Raise it if the agent loses the thread of what was just said — the immediate
      back-and-forth is where that lives. Lower it only if you are severely
      context-constrained and would rather keep older material in view.
    manage: >-
      Four turns is enough for the model to see what it just said and what you replied.
      High values interact with the verbatim budget: the floor wins, so setting both
      aggressively can push assembly against its hard cap.

  context.preassembly_summary_enabled:
    summary: Refresh the digest mid-turn rather than let anything drop uncovered.
    what: >-
      The backstop that guarantees nothing leaves the model's view without being
      summarised first.
    how: >-
      Before assembling an over-budget turn, the digest is refreshed so the turns about
      to age out are already covered. If the summarizer is unavailable, a deterministic
      fallback digest stands in — coverage does not depend on a model call succeeding.
    why: >-
      Leave it on. Off, a turn that outgrows its budget can drop history that the digest
      hasn't caught up with yet, and the agent silently forgets something you said. The
      cost is one extra summarisation on the turns that need it.
    manage: >-
      Pre-warm (`context.summary_trigger_ratio`) is what keeps this from firing often —
      this is the safety net, not the mechanism.

  # --- Conversation state
  context.conversation_state_enabled:
    summary: Keep a structured working memory for the conversation.
    what: >-
      A per-conversation record of goals, decisions, open threads and artifacts — plus
      the rolling digest of aged-out turns.
    how: >-
      Rendered into the prompt as a ledger block. The agent maintains it deliberately
      through the `update_conversation_state` tool, and you can edit it yourself from
      the composer badge.
    why: >-
      Leave it on for anything long-running: it's what lets an agent still know the goal
      after the turn that stated it has aged out. Turning it off hides the block and
      removes the agent's tool for it.
    manage: >-
      Structured state is also the default compaction target — see
      `context.conversation_state_compaction_enabled`.

  context.conversation_state_compaction_enabled:
    summary: Fold aged-out turns into the structured digest instead of free prose.
    what: Which of the two summary mechanisms receives compacted history.
    how: >-
      On, aged-out turns roll into the conversation state's digest field, re-summarised
      in place. Off, they fall back to the legacy free-prose rolling summary.
    why: >-
      The structured digest is the better default — it sits beside the goals and
      decisions it relates to, and it's editable. The prose fallback exists for
      comparison and for conversations where the structure gets in the way.
    manage: Inert when `context.conversation_state_enabled` is off.

  context.rehydrate_max_turns:
    summary: How far back to read when reopening a cold conversation.
    what: The cap on turns pulled from durable history when a session is resumed.
    how: >-
      Reopening a conversation the server no longer holds in memory replays up to this
      many turns from storage to rebuild context.
    why: >-
      Raise it for long-lived conversations you return to across days. Lower it if
      reopening a large conversation is slow — the cost is read volume at open time,
      not per turn.
    manage: >-
      This bounds what is *read*, not what is *sent*: the verbatim budget still decides
      how much of it reaches the model.

  context.max_input_tokens:
    summary: Optional hard ceiling on what one turn may spend on input.
    what: A per-turn spend guard for the tool loop, in tokens. 0 turns it off.
    how: >-
      With a value set, a turn stops growing its input past this ceiling even if the
      model's window would allow more — a brake on runaway multi-round tool loops.
    why: >-
      Set it when you want a predictable per-turn cost ceiling on an expensive model.
      Leave it at 0 to let the model's real window govern, which is the right default
      now that windows are read accurately.
    manage: >-
      This replaced a flat 32k cap that quietly strangled large-window models. Setting
      it too low reintroduces exactly that problem — prefer the model's own window
      unless you have a billing reason not to.

  # --- Compaction summarizer
  session.rolling_summary.enabled:
    summary: Whether conversations compact automatically at all.
    what: The master switch for automatic compaction, whichever target it writes to.
    how: >-
      Off, no automatic summarisation runs: turns stay verbatim until they hit the
      budget and then simply leave view.
    why: >-
      Leave it on. Off is for diagnosing whether a context problem comes from
      compaction — useful briefly, lossy as a standing setting.
    manage: >-
      Gates both the structured digest and the legacy prose summary. Named for the
      original prose mechanism, which the digest has since superseded as the default.

  session.rolling_summary.model:
    summary: Which model writes the compaction summaries.
    what: The model used to fold aged-out turns into the digest.
    how: >-
      Empty follows the Summarizer role, which is the recommended setting — set the
      role once and every summarising job follows it. An explicit value overrides the
      role for this job only.
    why: >-
      Override it when compaction specifically is too slow or too lossy, and you want a
      different trade-off here than for other summarising work.
    manage: >-
      Readers floor this to a small fast model regardless; compaction runs often and
      rarely benefits from a large one.

  session.rolling_summary.max_tokens:
    summary: How long one compaction pass may make the digest.
    what: The output budget for a single summarisation pass.
    how: >-
      The digest is re-summarised in place on each pass, so this effectively bounds its
      steady-state size rather than letting it grow with the conversation.
    why: >-
      Raise it when long conversations lose detail you needed. Lower it when the digest
      itself is eating the context you wanted for live turns.
    manage: >-
      Default 800 tokens. Because each pass rewrites the whole digest, raising this
      raises both the summarisation cost and the standing per-turn cost of carrying it.

  # --- In-turn compressors
  trajectory_compression.enabled:
    summary: Compress earlier tool rounds during a long turn.
    what: >-
      In-turn compression of the trajectory — the accumulated tool calls and results
      within a single turn.
    how: >-
      When a turn's context crosses the trigger threshold, earlier rounds are replaced
      by a compact knowledge block, keeping the most recent rounds intact.
    why: >-
      Leave it on for agents that use tools heavily; a research or multi-step turn can
      otherwise fill the window with intermediate results before it reaches an answer.
      Off, long tool loops hit the ceiling sooner.
    manage: Distinct from tool-output compression, which shrinks one oversized result.

  trajectory_compression.threshold_ratio:
    summary: How full a turn gets before earlier tool rounds are compressed.
    what: The fraction of the turn's budget that triggers in-turn compression.
    how: Crossing it compresses all but the most recent rounds into a knowledge block.
    why: >-
      Lower it for agents that routinely run long tool loops — compressing earlier keeps
      more headroom for the rounds that matter. Raise it to keep raw tool output visible
      longer, at the cost of hitting the ceiling sooner.
    manage: Default 0.75. Below about 0.5 you compress work that had room to breathe.

  trajectory_compression.preserve_recent_rounds:
    summary: How many recent tool rounds survive compression untouched.
    what: The number of most-recent tool-call rounds always kept in full.
    how: Compression works forward from the oldest round and stops here.
    why: >-
      Raise it if the agent loses track of what a tool just returned. Lower it to
      reclaim more room when rounds are large.
    manage: >-
      Two rounds is usually enough to keep the immediate call-and-result pair intact.
      This is a floor, like `context.recent_floor` but within a turn.

  trajectory_compression.model:
    summary: Which model compresses tool rounds mid-turn.
    what: The model that writes the knowledge block replacing earlier rounds.
    how: Empty follows the Summarizer role; an explicit value overrides it here only.
    why: >-
      Override when in-turn compression is adding noticeable latency — this one runs
      inside the turn, so its speed is felt directly.
    manage: Readers floor to a small fast model; latency matters more than nuance here.

  trajectory_compression.max_knowledge_chars:
    summary: How large the compressed knowledge block may be.
    what: The size cap on the block that replaces compressed tool rounds.
    how: The compressor writes within this budget; the block persists for the rest of the turn.
    why: >-
      Raise it when compression is dropping details the agent then has to re-fetch —
      re-running a tool costs more than carrying a few hundred extra characters. Lower
      it when the block itself is crowding the turn.
    manage: Default 3000 characters. Weigh against the cost of the tool call it saves.

  compression.enabled:
    summary: Summarise a single tool result that comes back too large.
    what: Compression of one oversized tool output, before it enters the turn.
    how: >-
      A result past the size threshold is summarised task-aware — with the question in
      view — so what survives is the part that answers it.
    why: >-
      Leave it on. A single large page or query result can otherwise consume the whole
      turn. Off, oversized results are truncated instead, which cuts arbitrarily.
    manage: >-
      Distinct from trajectory compression, which compresses *across* rounds. This one
      shrinks a single result.

  compression.model:
    summary: Which model summarises oversized tool results.
    what: The model used for task-aware compression of a single result.
    how: Empty follows the Summarizer role; an explicit value overrides it here only.
    why: Override when tool-heavy turns feel slow and this is where the time is going.
    manage: Readers floor to a small fast model.

  compression.max_summary_chars:
    summary: How much of an oversized tool result survives compression.
    what: The size budget for the summary that replaces a too-large result.
    how: The compressor writes within this budget, keeping what answers the query.
    why: >-
      Raise it when compressed results lose specifics the agent needed — figures,
      names, exact wording. Lower it when tool output still crowds the turn.
    manage: >-
      Default 2000 characters. If you find yourself raising this a lot, the more
      effective fix is usually a narrower tool query.

  # --- Recall from durable memory
  memory.episodic_leads_enabled:
    summary: Offer pointers to earlier conversations that look related.
    what: >-
      Short leads drawn from episodic memory — "we discussed this on…" — rather than
      full recalled content.
    how: >-
      Derived per turn and injected as a low-priority block, so they yield to the
      transcript and the state ledger when room is tight.
    why: >-
      Leave it on for continuity across conversations. Turn it off if leads to unrelated
      past chats are distracting the agent, or if you want per-turn context strictly
      scoped to the conversation at hand.
    manage: >-
      Leads are pointers, not recall; the Recall layer is what fetches actual content.
      They ride at low priority and are the first thing dropped under pressure.

  # ── Web Search · backend ────────────────────────────────────────────────
  search.backend:
    summary: Which search provider is tried first.
    what: >-
      The provider every web search goes to before anything else. Tavily and Brave
      answer the same question differently: Tavily returns ranked results plus the
      research suite (extract, crawl, map, deep research); Brave can return
      pre-extracted page content and supports Goggles for re-ranking.
    how: >-
      Every `web_search` call goes to this backend. If it errors or comes back empty
      and fallback is on, the other one is tried before the tool reports failure.
      The choice also decides which of the two API keys actually gets used.
    why: >-
      Stay on Tavily unless you specifically want Brave's grounded content or its
      Goggles: the extra web tools (`web_extract`, `web_map`, `web_crawl`,
      `web_research`) are Tavily-backed, so switching narrows what agents can do
      with a page once they have found it.
    manage: >-
      Whichever you pick needs its key set below. Use **Test connection** after
      changing this — it reports each backend separately, so you can see the new
      primary answering before you rely on it.

  search.fallback_enabled:
    summary: Try the other backend when the primary fails or finds nothing.
    what: >-
      A second attempt on the backend you did not choose, rather than returning an
      error to the agent.
    how: >-
      Fires on two conditions: the primary raised an error, or it returned zero
      results. The fallback call is a real, billable search on the other provider.
    why: >-
      Leave it on if both keys are set — a transient provider outage otherwise
      surfaces as "I couldn't find anything", which the agent will often accept as
      an answer rather than a failure. Turn it off if only one provider is
      configured, or if you are deliberately keeping spend on one account.
    manage: >-
      Fallback searches count against the same per-turn budget as the original, so
      a flapping primary consumes the turn's allowance twice as fast.

  search.tavily_api_key:
    summary: Your Tavily key — also what unlocks the extract, crawl, map and deep-research tools.
    what: >-
      Credentials for tavily.com. Beyond plain search, this key is what makes
      `web_extract`, `web_map`, `web_crawl` and `web_research` available at all.
    how: >-
      Stored server-side and never returned to the client — reading the config
      gives you a redacted mask. It falls back to the `TAVILY_API_KEY` environment
      variable when unset, so a container can supply it without ever writing it to
      `data/config.json`.
    why: >-
      Set this even if you run Brave as the primary backend: the research tools
      have no Brave equivalent except deep research, and only when the separate
      Answers plan is active.
    manage: >-
      Tavily bills per credit — a basic search is 1, an advanced search 2, and a
      deep-research call 5–20. At the shipped estimate of $0.008 per credit that is
      well under a cent for an ordinary search. Keys save on their own button, not
      by autosave; nothing is sent unless you type a new value over the mask.

  search.brave_api_key:
    summary: Your Brave key — the Search plan; deep research needs their separate Answers plan.
    what: >-
      Credentials for api.search.brave.com. The Search subscription covers ordinary
      search and grounding; Brave's deep research is a *different* product on the
      same key.
    how: >-
      Stored server-side and redacted on read, with a `BRAVE_API_KEY` environment
      fallback. A key without the Answers plan answers `OPTION_NOT_IN_PLAN` when
      deep research is attempted, and the key does not advertise which plans it
      holds — which is why Brave deep research ships off.
    why: >-
      Needed to select Brave as a backend or to use it as the fallback. Worth
      having as a second provider even on Tavily: fallback only helps if the other
      side is actually configured.
    manage: >-
      Brave Search bills about $5 per 1,000 requests — roughly $0.005 a search,
      comparable to Tavily's basic tier. Answers bills a request line of about
      $0.004 *plus* queries and tokens, and reports its own exact total.

  # ── Web Search · defaults ───────────────────────────────────────────────
  search.max_results:
    summary: How many results one search returns.
    what: >-
      The result count requested from the provider when the agent does not ask for
      a specific number.
    how: >-
      Passed with every search. Results arrive ranked, so raising this appends
      lower-relevance entries rather than improving the top of the list.
    why: >-
      Raise it when the agent keeps searching again with slightly different wording
      — that usually means the answer was just outside the window. Lower it to keep
      turns tight: every result is text the model reads and pays for, and on Brave
      with grounding on, each one can carry page content too.
    manage: >-
      Default 5, capped at 20. Past about 10 the tail is rarely read; if the agent
      needs breadth it is usually better served by another query than by a longer
      list of the same one.

  search.default_search_depth:
    summary: How hard Tavily digs before answering — and what that costs per search.
    what: >-
      Tavily's effort tier for a search. Deeper tiers read more of the web before
      ranking, so they surface material a fast pass misses.
    how: >-
      Applied when the model doesn't name a depth itself. Empty means no opinion —
      the provider's own default stands, which is the shipped state. Billing follows
      the tier: `advanced` costs 2 credits, the rest 1.
    why: >-
      Set `advanced` when the agent works on questions where the answer is not on
      the first page — technical detail, primary sources, anything niche. Set
      `fast` or `ultra-fast` when latency matters more than reach and the questions
      are ordinary. Doubling the credit cost of every search is the trade.
    manage: >-
      Brave ignores this. If you set `advanced` here, halve your expectation of how
      far the per-turn call budget stretches in dollars — the count doesn't change,
      the bill does.

  search.default_chunks_per_source:
    summary: How much of each result page to bring back.
    what: >-
      The number of content chunks Tavily returns per result, rather than a bare
      title and snippet.
    how: >-
      Applied when the model doesn't specify. 0 means no opinion — the provider
      decides, which is the shipped state. Higher values mean more of each page
      arrives inline with the search result.
    why: >-
      Raise it when the agent habitually follows every search with `web_extract` on
      the same pages: it is cheaper to bring the content back once than to fetch it
      twice. Leave it at 0 when searches are mostly navigational — you don't need
      three chunks of a page you only wanted the URL of.
    manage: >-
      Range 1–5. Multiply by max results to see what you are actually asking for:
      5 results × 3 chunks is fifteen passages of text entering the turn.

  search.safesearch:
    summary: Brave's content filter for results.
    what: >-
      How aggressively Brave filters adult and explicit results.
    how: >-
      Passed to Brave with each search. Empty means no opinion — Brave's own
      default applies, which is the shipped state. Tavily ignores it.
    why: >-
      Set `strict` for shared or workplace installs. Set `off` when the filter is
      getting in the way of legitimate research — medical and security topics are
      the usual casualties.
    manage: >-
      Brave only. Switching the backend to Tavily silently drops this; if filtering
      matters to you, that alone is a reason to stay on Brave.

  search.country:
    summary: Bias results toward one country.
    what: >-
      A two-letter country code that tilts ranking toward locally relevant results.
    how: >-
      Passed with each search when set. Empty means no preference, which is the
      shipped state. It is a bias, not a filter — results from elsewhere still
      appear.
    why: >-
      Set it when answers are regional and wrong by default: law, tax, pricing,
      availability, public services. Leave it empty for technical or academic work,
      where a country bias only narrows a global corpus for no gain.
    manage: >-
      Use the ISO code (`GB`, `DE`, `JP`). This does not change the *language* of
      results — that is the next setting, and the two are often both needed.

  search.search_lang:
    summary: Preferred language for results.
    what: >-
      A language code that tilts results toward pages written in that language.
    how: >-
      Passed with each search when set. Empty means no preference, the shipped
      state. Like the country bias it ranks rather than filters.
    why: >-
      Set it when the agent works in one language and keeps surfacing English
      sources it then has to translate. Leave it empty when the best source may be
      in any language — the model reads them all, and narrowing costs you reach.
    manage: >-
      Use the short code (`en`, `de`, `ja`). Pair with the country bias when you
      want local *and* in-language; setting only one often isn't enough.

  # ── Web Search · budgets ────────────────────────────────────────────────
  search.per_turn_limit:
    summary: How many searches one turn may run before the tool starts refusing.
    what: >-
      A ceiling on `web_search` and `web_research` calls within a single user turn.
      It exists to bound a tool loop that has started searching in circles.
    how: >-
      A budget window opens when your turn starts and closes when it ends. Each
      search draws one unit; a deep-research call draws more (see the Research Mode
      screen). Once the budget is gone the tool returns a budget error to the model
      instead of reaching the provider, so the turn continues — it just stops
      spending. **Only interactive turns are metered**: work running under
      delegation or the planner is not inside a window and is not capped here.
    why: >-
      The default of 8 is set to never bite ordinary use and only clip a runaway.
      Lower it if you have seen turns search a dozen times over one question; raise
      it if genuinely broad questions are being cut off mid-investigation. Research
      Mode does not use this number at all — it has its own, much larger one.
    manage: >-
      0 means unlimited, which is worth avoiding on a metered key. A call count is
      a rough proxy for spend once a single deep call can cost 20× a basic search,
      which is what the dollar ceiling below is for; set both and whichever runs
      out first stops the turn.

  search.per_turn_cost_usd:
    summary: A dollar ceiling on one turn's searching, alongside the call count.
    what: >-
      The most a single turn's web searching may cost before the tool stops
      reaching providers. It binds together with the call limit — whichever runs
      out first ends that turn's spending.
    how: >-
      Every search's estimated cost is charged against the open budget window as it
      happens, using the provider's own reported figure where there is one and a
      per-credit estimate otherwise. When the running total reaches this ceiling,
      further searches return a budget error rather than billing.
    why: >-
      This is the ceiling that actually corresponds to money. A call count treats a
      basic search and a `pro` deep-research call as equal when one costs twenty
      times the other. Set this if you have a metered key and a number you would be
      unhappy to see on one question.
    manage: >-
      0 — the shipped default — means no cost ceiling, so nothing changes until you
      set one. For scale: an ordinary search runs under a cent, so even $0.25 a
      turn is generous for normal chat and still catches a loop.

  search.research_per_turn_cost_usd:
    summary: The same dollar ceiling, for turns running in Research Mode.
    what: >-
      A separate spend ceiling that applies only while a conversation is in
      Research Mode, where the call budget is deliberately much larger.
    how: >-
      Swapped in for the ordinary ceiling whenever the turn carries the elevated
      research budget. Charged the same way, against the same window.
    why: >-
      Research Mode raises the call budget roughly fivefold, which is exactly the
      situation where a runaway costs real money — deep research calls are the
      expensive ones. Setting this is how you say "research may be thorough, but
      not unbounded".
    manage: >-
      0 means no ceiling. The Research Mode screen shows a projected worst case for
      your current budget and depth; a ceiling somewhere near that figure will
      almost never fire on a normal engagement but will stop a pathological one.

  search.timeout:
    summary: How long one search may hang before it is abandoned.
    what: >-
      A hard wall-clock cap on a single provider call.
    how: >-
      Searches run synchronously inside the tool loop, so a call that never returns
      blocks the whole turn — including your Stop button, which can only take
      effect between rounds. This cap is what guarantees the turn comes back.
    why: >-
      Raise it only if legitimate searches are timing out, which usually means a
      slow deep tier rather than a slow network. Lowering it makes a wedged
      provider fail faster, at the cost of abandoning searches that would have
      answered.
    manage: >-
      Default 15 seconds. Tavily's own client default is around 60, which is why
      this exists — an unbounded call is indistinguishable from a hung app.

  search.cache_ttl_seconds:
    summary: How long an identical search is served free from memory.
    what: >-
      A short in-process cache of search results, keyed by the query. A repeat
      within the window returns the stored result without billing.
    how: >-
      Held in the server's memory, so it is lost on restart and not shared between
      instances. Only exactly-repeated queries hit it.
    why: >-
      The default of 5 minutes is aimed at the common loop where an agent searches,
      reads, and searches the same thing again a moment later. Raise it if your
      agents revisit the same questions inside one session; lower it — or set 0 —
      when freshness genuinely matters, such as news or prices.
    manage: >-
      0 disables caching entirely, and every repeat becomes a billable search.
      Deep research has its own, much longer cache on the Research Mode screen,
      because a repeated deep call is far more expensive to redo.

  # ── Web Search · Brave grounding ────────────────────────────────────────
  search.brave_grounding_default:
    summary: Have Brave return page content, not just a list of links.
    what: >-
      Brave can return pre-extracted, relevance-ranked passages from the results —
      search and extract fused into one call.
    how: >-
      When on, Brave searches route through the grounding endpoint and come back
      with content already attached, bounded by the token budgets below. The model
      can still ask for a plain link list per call when it only wants URLs.
    why: >-
      Leave it on. Whenever the agent would have read those pages anyway, one
      grounded search replaces a search *and* an extract — a clear saving. It does
      cost more than a bare link list for a quick "what is the URL for X", which is
      why the model can opt out per call.
    manage: >-
      Brave only; Tavily has no equivalent and ignores this. If grounded searches
      feel bloated, tighten the token budgets or the relevance threshold before
      turning the feature off.

  search.brave_context_max_tokens:
    summary: The ceiling on content one grounded search may return.
    what: >-
      A total token budget for everything a single grounded Brave search brings
      back, across all of its results.
    how: >-
      Enforced per search. Passages are included in relevance order until the
      budget is spent, so what falls off the end is what mattered least.
    why: >-
      Raise it when grounded searches are clearly truncating material the agent
      then has to fetch separately. Lower it when searches are crowding the context
      window — this is content that enters the turn and is paid for on every
      subsequent message in it.
    manage: >-
      Default 4096, well under Brave's own ceiling of 32768. That gap is
      deliberate: a default returning 8k tokens per search would undo the saving
      grounding exists to create. Read it together with the per-URL cap below.

  search.brave_context_max_tokens_per_url:
    summary: The ceiling on how much any single page may contribute.
    what: >-
      A per-result share of the grounded search's total budget, so one long page
      cannot consume the whole thing.
    how: >-
      Applied to each result before the total budget is filled. A page whose
      relevant passages exceed this is truncated; the freed budget goes to other
      results.
    why: >-
      Raise it when the answer is usually deep inside one long document and you are
      getting the top of it. Lower it to force breadth — several sources sampled
      rather than one quoted at length.
    manage: >-
      Default 1024, a quarter of the total budget, so at least four sources can
      contribute. Setting it equal to the total lets a single page take everything,
      which is rarely what you want from a *search*.

  search.brave_context_threshold:
    summary: How picky Brave is about which passages count as relevant.
    what: >-
      The relevance bar a passage must clear to be included in grounded content.
    how: >-
      Applied when selecting passages, before the token budgets are filled. A
      stricter bar means fewer passages qualify, so the budget goes further per
      source and may not be spent at all.
    why: >-
      Move to `strict` when grounded results feel padded with material that only
      loosely relates. Move to `lenient` when the agent keeps missing content you
      can see on the page — a strict bar drops passages that were relevant but
      worded unlike the query.
    manage: >-
      `balanced` is the default and is right for most work. This interacts with the
      token budgets: strict plus a large budget usually returns less than lenient
      plus a small one.

  search.brave_answers_enabled:
    summary: Allow Brave's deep research — needs their separate Answers plan.
    what: >-
      A second backend for `web_research`, so deep research still works when Brave
      is the active search backend rather than Tavily.
    how: >-
      Routes deep research through Brave's research endpoint. Answers is a separate
      subscription from Brave Search, and a key does not advertise which plans it
      holds — an unsubscribed key answers `OPTION_NOT_IN_PLAN`.
    why: >-
      Turn it on once the Answers plan is actually active on your key. This is the
      rare feature that ships **off**: enabling it by default would advertise a
      tool that always fails for everyone who has not bought the plan, which is
      worse than not offering it.
    manage: >-
      Answers bills a request line of roughly $0.004 *plus* queries and tokens on
      top, and reports its own exact total per call — so the ledger shows real
      figures rather than an estimate. If deep research fails immediately with a
      plan error, this is the setting to turn back off.

  # ── Web Search · source policy ──────────────────────────────────────────
  search.source_policy:
    summary: Which corners of the web may ground an answer — preferred, blocked, and Brave Goggles.
    what: >-
      An operator-owned answer to "where may this agent get its facts". Three
      parts: **preferred** domains to favour, **blocked** domains never to return,
      and a Brave **Goggle** for finer re-ranking than a list allows.
    how: >-
      Applied to every search and mapped per backend — Tavily receives include and
      exclude domain lists, Brave receives an inline Goggle. The asymmetry that
      matters: **blocked is a hard floor**, always merged in and impossible for the
      model to widen past. **Preferred is a soft preference** — it seeds the
      include list, but a model that passes its own domain scope for a specific
      call wins, because silently over-narrowing is how a research turn comes back
      empty.
    why: >-
      Use blocked for sources you consider actively unreliable — the agent then
      cannot cite them however it phrases the query. Use preferred to steer toward
      a corpus you trust without cutting the agent off from everything else.
      Goggles are for shaping rather than gating: boost and downrank rather than
      allow and deny.
    manage: >-
      Comma-separated domains; wildcards like `*.edu` work. Preferred is the one
      that bites unexpectedly — a narrow list on a broad question returns nothing,
      and the agent reads that as "no such information exists". Start with blocked,
      which has no such failure mode. The Goggle field is Brave-only and takes
      either a hosted Goggle URL or inline rules; it is merged after the two lists.

  # ── Research Mode ───────────────────────────────────────────────────────
  search.research_per_turn_limit:
    summary: The elevated search budget a Research Mode turn may spend.
    what: >-
      The per-turn search ceiling that replaces the ordinary one whenever a
      conversation is in Research Mode. This — not the tool-round cap — is what
      actually governs how deep research goes.
    how: >-
      Swapped in for `search.per_turn_limit` when the turn carries the research
      flag. Each ordinary search draws one unit; a deep-research call draws several
      (see the deep-research weight below), so the budget is spent in uneven bites.
    why: >-
      Raise it for genuinely broad engagements — a survey of a field, a comparison
      across many sources. Lower it to keep research from becoming an expensive
      default. If reports read as thorough but shallow, this is the first number to
      move, not the tool-round cap.
    manage: >-
      Default 40 — about five times the ordinary budget, and enough for a dozen
      deep calls or forty cheap ones. 0 means unlimited, which on a metered key is
      exactly where an unattended research turn can cost real money; prefer a large
      number to none. The screen projects a worst-case dollar figure as you change
      this.

  research.enabled:
    summary: Whether Research Mode can be turned on for a conversation at all.
    what: >-
      The master switch for the whole feature: an elevated search budget plus a
      rigorous, self-reviewing research prompt that lands a cited report in the
      attached Project.
    how: >-
      Off hides the Research chip in the composer everywhere, so no conversation
      can enter the mode. It does not affect ordinary web search, which keeps its
      own budget.
    why: >-
      Leave it on — it costs nothing until a conversation actually uses it. Turn it
      off on a shared or cost-sensitive install where you would rather no one could
      start a multi-dollar research turn by clicking a chip.
    manage: >-
      This is a global gate, not a default: turning it on does not put any
      conversation into research mode. Each conversation opts in.

  research.default_depth:
    summary: The deep-research effort tier research starts from — the main cost dial.
    what: >-
      Which tier of deep research the prompt steers toward when it reaches for
      `web_research`. The agent may still escalate for the hardest questions.
    how: >-
      Three tiers of increasing thoroughness. At the shipped credit estimate they
      run roughly $0.04, $0.08 and $0.16 per deep call for mini, auto and pro.
    why: >-
      Move to `mini` when research is frequent and the questions are not deep — it
      quarters the per-call cost against `pro`. Move to `pro` when reports come
      back thin on questions you know have rich source material.
    manage: >-
      `auto` is the default and lets the provider judge. Read this together with
      the research search budget: depth sets the price per deep call, the budget
      sets how many of them a turn may make, and their product is the worst case.

  research.max_tool_rounds:
    summary: How many tool-use rounds a research turn may take.
    what: >-
      The ceiling on back-and-forth tool rounds within a single research turn,
      replacing the ordinary chat limit.
    how: >-
      When rounds run out the loop forces an answer with whatever it has. It is
      deliberately generous so that the *search budget* is what binds first.
    why: >-
      Mostly leave it alone. If reports end abruptly or mid-investigation, check
      whether the search budget ran out first — that is the usual cause, and
      raising rounds will not help. Raise this only when you have watched a turn
      hit the round cap with search budget still unspent.
    manage: >-
      Default 40, against a much smaller chat default. If rounds bind before the
      search budget, the turn force-answers mid-research, which reads as a
      confident report built on half the evidence — the failure mode worth
      avoiding.

  research.min_max_tokens:
    summary: A floor on the output budget for a research turn's replies.
    what: >-
      The minimum number of output tokens a research completion may be given,
      overriding the ordinary adaptive budget.
    how: >-
      A research turn must fit its thinking *and* a full report into one call. The
      chat-sized budget, which adapts down as context fills, starves exactly that.
      This floor is still bounded by the model's real output cap.
    why: >-
      Raise it if reports are being cut off mid-section. Lower it only to control
      cost on a model that charges heavily for output — the saving is real but the
      failure mode is a truncated report, which is worth less than no report.
    manage: >-
      Default 16384. If reports still truncate, the model's declared output cap is
      the likelier constraint: a model missing from the catalog falls back to a
      conservative figure, and setting its real limit under **Model Limits**
      unlocks this floor.

  web_research.enabled:
    summary: Whether the deep-research tool may be used at all.
    what: >-
      The agentic deep-research tool — an autonomous multi-query investigation that
      returns a synthesised, sourced answer rather than a list of links.
    how: >-
      Off makes the tool report itself as disabled rather than blocking the turn,
      so research falls back to ordinary search plus extraction.
    why: >-
      Leave it on for real research work; it is the difference between a report
      built on a dozen sources and one built on three. Turn it off when cost
      matters more than depth — a single deep call can cost twenty ordinary
      searches.
    manage: >-
      Independent of Research Mode: the tool is available in ordinary turns too,
      where it draws on the ordinary search budget and can consume most of it in
      one call. That interaction is the reason for the deep-research weight below.

  web_research.budget_weight:
    summary: How many budget units one deep-research call costs.
    what: >-
      The number of units a `web_research` call charges against a turn's search
      budget, reflecting that it is one call but an expensive one.
    how: >-
      Charged against whichever budget the turn is running under. At the default,
      three deep calls cost the same budget as nine ordinary searches.
    why: >-
      Raise it if deep research is consuming turns that should have done more
      cheap, broad searching first. Lower it if the weight is stopping research
      short while actual spend is comfortably within your ceiling.
    manage: >-
      Default 3, against a real cost ratio nearer 5–20× an ordinary search — so the
      weight understates the money deliberately, to avoid making deep research
      unusable inside a small budget. If you want the count to track spend
      honestly, use the dollar ceiling instead; that one measures the real thing.

  web_research.cache_ttl_seconds:
    summary: How long an identical deep-research result is reused.
    what: >-
      A cache of completed deep-research results, keyed by query and depth.
    how: >-
      A repeat of the same query at the same depth inside the window returns the
      stored report without re-running the investigation or billing for it.
    why: >-
      Keep it generous. A deep call costs 5–20 credits, so serving a repeat from
      cache is the single largest saving available here — much more than caching
      ordinary searches. Shorten it only when the subject genuinely moves within
      the window.
    manage: >-
      Default 30 minutes, six times the ordinary search cache, because deep
      research is both expensive and stable. Held in server memory, so a restart
      clears it.

  web_research.poll_timeout_seconds:
    summary: How long to wait for a deep-research report before giving up.
    what: >-
      The total wall-clock ceiling on waiting for a deep-research task to finish.
    how: >-
      Deep research is asynchronous: the call starts a task and the result is
      collected by polling. When this deadline passes the tool returns an error
      advising a narrower query or a shallower tier, rather than waiting forever.
    why: >-
      Raise it if `pro`-tier research routinely times out on questions you need
      answered — the tiers differ enormously in wall-clock time. Lower it to fail
      fast on an install where a four-minute pause inside a turn is unacceptable.
    manage: >-
      Default 240 seconds. For scale: mini usually completes in 30–60 seconds, auto
      in one to two minutes, and pro can genuinely take several. Setting this below
      your chosen depth's typical time turns every deep call into a timeout.

  web_research.poll_interval_seconds:
    summary: How often to check whether the report is ready.
    what: >-
      The gap between polls while waiting for a deep-research task.
    how: >-
      Each poll is a cheap status check, not a re-run. Shorter gaps notice
      completion sooner; longer gaps make fewer requests.
    why: >-
      There is rarely a reason to change this. Shorten it only if you want a
      completed report picked up promptly on short `mini` calls; lengthen it if
      polling volume is a concern on a rate-limited key.
    manage: >-
      Default 5 seconds against a timeout measured in minutes, which is a sensible
      ratio. Setting it near the timeout means the deadline can pass between two
      polls and a finished report is reported as a timeout.

  # ── Thinking Patterns · availability ────────────────────────────────────
  reasoning.chat_patterns_enabled:
    summary: The master switch for reasoning scaffolds in chat.
    what: >-
      Whether the agent may be given a thinking pattern at all — a structure it
      follows before answering, compiled into the live streamed turn rather than
      run as a separate step you wait for.
    how: >-
      Off restores plain turns: no pattern is selected, no pre-calls are made, and
      the per-pattern switches below stop mattering. Models that think natively
      still stream their own reasoning — that is the provider's behaviour, not
      this feature's.
    why: >-
      Leave it on. The patterns are what turn a fast answer into a considered one,
      and Auto only reaches for the expensive ones when the message warrants it.
      Turn it off to isolate whether a behaviour you dislike comes from the
      scaffolding or from the model itself — that is what a kill-switch is for.
    manage: >-
      This is the global fallback. Each agent profile carries its own default, and
      the composer chip overrides for a single conversation, so turning this off
      is the only way to be certain no pattern runs anywhere.

  reasoning.cot_enabled:
    summary: Allow the step-by-step pattern.
    what: >-
      Chain of thought — the agent works through a problem in explicit steps
      before committing to an answer.
    how: >-
      Costs nothing extra: the structure rides in the same call as the answer, so
      the only price is the output tokens the reasoning itself occupies.
    why: >-
      Keep it on. It is the cheapest pattern here and the one that helps most
      broadly. The one case it does not help is a model that already reasons
      natively — Auto knows this and will not stack a redundant scaffold on top.
    manage: >-
      If turns feel padded with visible working you did not want, the thing to
      change is usually the agent's profile default rather than this switch,
      which removes the pattern from every agent at once.

  reasoning.step_back_enabled:
    summary: Allow the principles-first pattern.
    what: >-
      Step-back — before answering, the agent distils the governing principles of
      the question, then answers with those in hand.
    how: >-
      Costs **one small hidden pre-call** before the turn. The principles are not
      shown; they enter the prompt that produces the answer.
    why: >-
      Worth keeping on for conceptual and design questions, where naming the right
      principle changes the answer rather than decorating it. Turn it off if the
      extra call's latency is noticeable on work that is mostly factual — a
      pre-call adds real wall-clock time before anything starts streaming.
    manage: >-
      The model and timeout for that pre-call are below. If step-back turns feel
      slow, check the timeout before disabling the pattern outright.

  reasoning.reflection_enabled:
    summary: Allow the draft-then-critique pattern.
    what: >-
      Reflection — the agent drafts an answer, criticises its own draft, and
      revises before you see anything.
    how: >-
      The most expensive pattern in ordinary use: it spends output tokens on a
      draft you never read. It also gates the multi-pass "reflect deeply" variant,
      so turning it off removes both.
    why: >-
      Keep it on for work where being wrong is costly and being slow is not.
      Turn it off when turns are short and conversational — the critique pass has
      little to find and you pay for it every time.
    manage: >-
      Watch the thinking output floor below if reflection answers arrive
      truncated: draft, critique and answer all come out of the same output
      budget.

  reasoning.self_consistency_enabled:
    summary: Allow the consensus pattern — several samples, one judged answer.
    what: >-
      Self-consistency — the same question is answered several times
      independently and the agreed answer wins.
    how: >-
      The k samples **are** the cost: at the default this is roughly three times
      an ordinary turn. Auto only selects it for short calculation or logic
      questions with no tools, where independent attempts genuinely disagree and
      the majority is usually right.
    why: >-
      Keep it on if arithmetic and logic matter in your work; that is exactly
      where a single sample is unreliable and voting fixes it. Turn it off if
      cost matters more — it is the clearest multiplier on this screen.
    manage: >-
      The sample count and the model used for sampling are below. Pointing the
      samples at a cheaper model is usually better than reducing k, since the
      value comes from independent attempts rather than from each being excellent.

  # ── Thinking Patterns · auto selection ──────────────────────────────────
  reasoning.auto_classifier_enabled:
    summary: Let a small model break the tie when the heuristics are unsure.
    what: >-
      An optional second opinion inside Auto mode. Auto always runs instant
      keyword heuristics first; this decides what happens when those are not
      confident.
    how: >-
      The heuristics are free and run on every message, so **the common path
      costs nothing extra**. Only when they are unconfident — and only on a
      message long enough to be worth it — does one tiny classification call
      fire, bounded at about 150 output tokens and a five-second timeout.
    why: >-
      Leave it on. It is the cheapest quality improvement here: a bounded call on
      a minority of messages, choosing between patterns you are already paying
      for. Turn it off only if you want Auto to be strictly deterministic, or on
      an install where any extra provider call is unwelcome.
    manage: >-
      With this off, unconfident cases fall back to the heuristics' best guess
      rather than to no pattern. The message-length floor below is what keeps it
      from firing on trivial turns.

  reasoning.classifier_model:
    summary: Which model breaks the tie.
    what: >-
      The model used for the bounded classification call — a small, fast
      judgement, not a reasoning task.
    how: >-
      Empty follows the **Fast Utility** role, so it moves with that role rather
      than needing to be set here. The call is capped at about 150 output tokens
      with a five-second timeout regardless of the model chosen.
    why: >-
      Set it only to pin a specific model for this one job — usually because the
      Fast Utility role points somewhere you would rather not send message text,
      or because you want the cheapest possible model for a decision this small.
    manage: >-
      Do not point this at a large reasoning model. The call is a classification
      with a hard timeout; a slow model will simply time out and the heuristics
      will decide anyway, having cost you five seconds.

  reasoning.classifier_min_chars:
    summary: How long a message must be before the tiebreak is worth paying for.
    what: >-
      A length floor. Below it, the classification call never fires and Auto
      settles the choice with heuristics alone.
    how: >-
      Measured against the message you sent. Short messages are overwhelmingly
      simple ones, and paying a provider call to decide how to think about
      "thanks" is pure overhead.
    why: >-
      Lower it if you write tersely and still want careful pattern selection —
      a dense two-line question can deserve more thought than a rambling
      paragraph. Raise it to cut classifier calls further on a chatty install.
    manage: >-
      Default 240 characters, roughly a short paragraph. 0 means every message is
      eligible, which is the setting most likely to make the classifier's cost
      visible.

  # ── Thinking Patterns · pattern models and budgets ──────────────────────
  reasoning.step_back_model:
    summary: Which model distils the principles before a step-back turn.
    what: >-
      The model used for step-back's hidden pre-call.
    how: >-
      Empty uses **the conversation's own model** — not a role. That differs from
      the classifier above, which follows Fast Utility, and it is deliberate: the
      principles feed directly into the answering prompt, so a mismatch in
      capability shows up in the answer.
    why: >-
      Point it at a cheaper model when step-back is common and the principles are
      straightforward; point it at a stronger one when the conceptual framing is
      the hard part and the answer is easy once framed.
    manage: >-
      Keep in mind this is a *pre*-call: its latency is added before anything
      streams. A slow model here makes every step-back turn feel unresponsive
      even if the answer is fast.

  reasoning.step_back_timeout_seconds:
    summary: How long to wait for those principles before giving up on them.
    what: >-
      A wall-clock cap on the step-back pre-call.
    how: >-
      On timeout the turn proceeds without the principles rather than failing —
      you get an ordinary answer, slightly later than you would have.
    why: >-
      Raise it if you have pointed step-back at a slower model and are losing the
      pre-call to timeouts. Lower it to keep the worst-case delay before
      streaming tight — this cap is exactly that delay.
    manage: >-
      Default 20 seconds. Since the failure mode is silent — the pattern degrades
      to no pattern — a too-low value looks like step-back "not doing anything"
      rather than like an error.

  reasoning.sc_model:
    summary: Which model produces the consensus samples.
    what: >-
      The model used for the k independent attempts that consensus votes over.
    how: >-
      Empty uses **the conversation's own model**. The samples are the cost of
      this pattern, so this setting multiplies: whatever the model charges, it
      charges k times.
    why: >-
      The best lever on this screen for making consensus affordable. Voting draws
      its value from attempts being *independent*, not from each being excellent,
      so a cheaper sampling model usually keeps most of the benefit at a fraction
      of the price.
    manage: >-
      Read it with the sample count below: cheaper model plus a higher k is often
      a better trade than an expensive model sampled twice.

  reasoning.sc_k:
    summary: How many independent attempts consensus votes over.
    what: >-
      The number of samples drawn before the agreed answer is chosen.
    how: >-
      Each sample is a full completion, so this is a direct multiplier on the
      turn's cost. An odd number avoids ties.
    why: >-
      Raise it when a question is genuinely marginal and three attempts still
      disagree; lower it to 2 only if you want the pattern nearly free, accepting
      that two samples cannot form a majority.
    manage: >-
      Default 3, capped at 5. Returns fall off quickly — the gap between 3 and 5
      is much smaller than the gap between 1 and 3, while the cost difference is
      the same size.

  reasoning.min_output_tokens:
    summary: A floor on output budget when the agent is thinking.
    what: >-
      Thinking spends output tokens before the visible answer begins, so a budget
      sized for the answer alone can leave nothing for the answer.
    how: >-
      0 means automatic: the budget floors itself whenever a pattern is active or
      the model reasons natively. A non-zero value pins the floor regardless.
    why: >-
      Set it when answers are being cut off mid-sentence on thinking turns and
      the automatic floor is not enough — long reflection passes are the usual
      cause. Leave it at 0 otherwise; the automatic behaviour already covers the
      case this exists for.
    manage: >-
      The model's own output cap still binds above this, so a large value here
      does nothing if the model cannot deliver it. If raising this does not help,
      the model's declared limit under **Model Limits** is the real constraint.

  # ── Task Planner ────────────────────────────────────────────────────────
  planner.enabled:
    summary: Whether the agent breaks big requests into a plan first.
    what: >-
      Task decomposition — turning one complex request into an ordered set of
      subtasks before doing any of them.
    how: >-
      Off means every request is worked straight through. On, a request that
      clears the complexity threshold gets a planning call first, and the plan
      then drives execution.
    why: >-
      Keep it on for multi-step work. Turn it off if your requests are mostly
      single-shot and the planning step reads as ceremony — it costs a call and
      some latency before anything visible happens.
    manage: >-
      The threshold below decides *which* requests get planned, so it is usually
      the better dial than this switch: raising the threshold keeps planning for
      the work that needs it and skips the rest.

  planner.complexity_threshold:
    summary: How complex a request must be before it gets a plan.
    what: >-
      The bar a request must clear before the planner is invoked at all.
    how: >-
      Three levels. `simple` plans nearly everything, `complex` — the shipped
      default — plans only genuinely multi-step requests, and `moderate` sits
      between.
    why: >-
      Raise to `complex` if simple requests are being over-planned into ceremony.
      Lower toward `simple` if the agent charges into multi-step work with no
      structure and loses the thread halfway through.
    manage: >-
      This is the dial to reach for before turning planning off entirely. The
      failure mode of over-planning is wasted latency; the failure mode of
      under-planning is work abandoned half-done, which is worse.

  planner.max_subtasks:
    summary: A hard cap on how many pieces a request may be split into.
    what: >-
      The ceiling on subtasks in a single plan, regardless of how the model would
      like to decompose the work.
    how: >-
      Applied to the plan the model produces. A request that genuinely needs more
      pieces gets a coarser plan rather than a longer one.
    why: >-
      Raise it for genuinely large engagements where a coarse plan loses
      important structure. Lower it to force the agent to think in bigger steps —
      long plans tend to fragment work into pieces too small to carry context.
    manage: >-
      Default 6. Each subtask is execution overhead as well as planning
      overhead, so the cost of a high cap is paid on every step, not once.

  planner.model:
    summary: Which model writes the plan.
    what: >-
      An explicit model for the planning call, overriding the agent's own.
    how: >-
      Unset means the agent's default model plans its own work. Clearing this
      back to unset is a real write, not a no-op.
    why: >-
      Set it when planning quality matters more than planning cost — decomposition
      rewards a stronger model more than most background tasks do, because a bad
      plan is expensive to follow. Set it cheaper when plans are routine.
    manage: >-
      Planning happens once per request while execution happens many times, so a
      stronger planner is usually better value than a stronger executor.

  planner.temperature:
    summary: How much variety the planner allows itself.
    what: >-
      Sampling temperature for the planning call only.
    how: >-
      Lower values make decomposition more deterministic and conventional; higher
      values let the planner consider less obvious orderings and groupings.
    why: >-
      Keep it low. Planning is a structural task, not a creative one, and a
      high-temperature plan is mostly a differently-shaped plan rather than a
      better one. Raise it only if plans feel formulaic on work that has genuinely
      unusual structure.
    manage: >-
      Default 0.3, deliberately below the conversational default. If plans are
      erratic between identical requests, this is the first thing to lower.

  planner.max_tokens:
    summary: How much room the plan itself may take.
    what: >-
      The output budget for the planning call.
    how: >-
      A plan that does not fit is truncated, which produces a partial plan rather
      than an error — the agent then executes an incomplete decomposition.
    why: >-
      Raise it if plans arrive visibly cut short, particularly with a high subtask
      cap. Lower it only to control cost on a planner pointed at an expensive
      model.
    manage: >-
      Default 1000, comfortable for the shipped subtask cap. If you raise
      `max_subtasks` substantially, raise this with it — the two bind together
      and truncation is silent.

  planner.prompt_override:
    summary: Replace the built-in planning prompt with your own.
    what: >-
      The instruction the planner works from. Empty uses the shipped prompt,
      which is the normal state.
    how: >-
      An override replaces the built-in prompt entirely rather than appending to
      it, so anything the shipped prompt established has to be restated.
    why: >-
      Worth touching only when you can trace a planning failure to the wording —
      for instance a domain where the default decomposition style is wrong. For
      per-agent behaviour, the agent's profile is a better place than a global
      override.
    manage: >-
      Leaving this empty means the prompt improves when the shipped one does; an
      override opts out of that permanently. Clear it to return to the default.

  # ── Agent Teams ─────────────────────────────────────────────────────────
  alloy.allow_adhoc_delegation:
    summary: Let agents hand work to each other outside a defined team.
    what: >-
      Whether an agent in a normal conversation is offered a roster of other
      agents it may dispatch a subtask to.
    how: >-
      On, agents get a delegation tool and a roster block naming who is
      available. The roster is **opt-in per profile** — an agent appears only if
      it has been marked available for delegation — so nothing delegates on a
      fresh install regardless of this switch.
    why: >-
      Leave it on. The opt-in roster is the real gate, and this being on is what
      lets you enable delegation by ticking a profile rather than by finding this
      setting. Turn it off to guarantee that only defined teams delegate.
    manage: >-
      A conversation can also disable delegation for itself, so this is the
      outermost of three gates: this switch, the per-profile opt-in, and the
      per-conversation override.

  alloy.chain_of_command:
    summary: Restrict delegation to the org chart where one exists.
    what: >-
      Strict adjacency for agents that belong to an organisation: a manager may
      dispatch to the leads of teams it owns, a lead to its own members, a member
      upward to its own lead — and no further.
    how: >-
      Enforced in two places at once: the delegation tool only *offers* legal
      targets, and the executor rejects an illegal one anyway. Only agents whose
      teams name a manager are considered part of an org, so installs with no org
      structure are completely unaffected.
    why: >-
      Leave it on if you have built an org. It is what stops a specialist at the
      bottom of the chart dispatching across the whole roster, which is how a
      delegation chain becomes unbounded.
    manage: >-
      Turning it off does not remove the org — it removes the *restriction*, so
      every org agent falls back to the flat opt-in roster.

  alloy.max_delegation_depth:
    summary: How far a chain of delegation may run.
    what: >-
      The limit on delegation depth: an agent dispatching to an agent that
      dispatches again, and so on.
    how: >-
      Counted from the agent handling your turn. At the limit, further delegation
      is refused and the agent must do the work itself.
    why: >-
      This is the main runaway guard. Each level multiplies both cost and
      latency, and a deep chain is usually a sign that the work was not scoped
      rather than that it was genuinely deep. Lower it if delegation is running
      away; raise it only for deliberately layered org structures.
    manage: >-
      Default 3, capped at 5. Read together with the parallel limit: depth times
      parallelism is roughly the worst-case fan-out of a single turn.

  alloy.max_parallel_delegations:
    summary: How many subtasks may run at once.
    what: >-
      The ceiling on concurrent dispatches from a single agent.
    how: >-
      Excess dispatches queue rather than failing. Parallelism cuts wall-clock
      time without changing total cost — the same work is done either way.
    why: >-
      Raise it when a team's specialists are independent and you want the turn to
      finish sooner. Lower it if concurrent work is hitting provider rate limits,
      which surfaces as sporadic delegation failures rather than as slowness.
    manage: >-
      Default 3, capped at 8. This bounds one agent's fan-out, not the whole
      turn's — combined with depth, a modest number here can still produce a
      large tree.

  alloy.delegation_timeout_seconds:
    summary: How long a delegated subtask may run before it is abandoned.
    what: >-
      A wall-clock cap on one dispatched subtask.
    how: >-
      On timeout the dispatching agent gets a failure for that subtask and
      carries on with the rest, rather than the whole turn hanging.
    why: >-
      Raise it when specialists do genuinely long work — deep research or a large
      document pass will exceed a short cap routinely. Lower it to fail fast when
      delegation is meant to be quick and a hung specialist is worse than a
      missing answer.
    manage: >-
      Default 300 seconds. Set it against the *effort tier* a dispatch uses:
      tiers set the specialist's tool-round budget, and a marathon tier against a
      short timeout will be cut off every time.

  alloy.non_blocking_delegations:
    summary: Let a dispatch return immediately and fold its report in later.
    what: >-
      An additional dispatch style: instead of waiting for the specialist, the
      agent gets a receipt at once and the result arrives later in the same turn.
    how: >-
      The dispatching agent keeps working while the subtask runs, and the report
      is folded in when it lands. Nothing outlives the turn — an unfinished work
      order is cancelled when the turn ends, however it ends.
    why: >-
      Leave it on. It is the difference between an agent that stalls on every
      dispatch and one that keeps making progress, and it costs nothing extra —
      the same work runs either way.
    manage: >-
      Turn it off if you want strictly sequential, easier-to-follow turns; the
      transcript of a non-blocking turn interleaves the agent's own work with
      reports arriving out of order.

# ═══════════════════════════════════════════════════════════════════════════
# Section blurbs — one per settings screen. See the header note for the shape.
# ═══════════════════════════════════════════════════════════════════════════

sections:
  overview:
    summary: What you've changed, and where everything lives.
    what: >-
      The landing page for settings. It reads the settings manifest — the same
      declaration the API validates writes against — so the list of what you've
      moved off its default is computed, never curated.
    why: >-
      Start here when you've inherited a configuration you didn't set up, or when
      something behaves unexpectedly and you want to see what is not stock.

  # ── Infrastructure ───────────────────────────────────────────────────────
  providers:
    summary: Where AgentX gets its intelligence.
    what: >-
      Connections to the model backends: the five built-ins (Anthropic, OpenAI,
      OpenRouter, Vercel, LM Studio) plus any OpenAI-compatible endpoint you
      register yourself, which then addresses its models as `yourid:model`.
    why: >-
      The first thing to configure on a new install — nothing else works without
      at least one reachable provider. Come back when a backend stops responding,
      when you're adding a local or self-hosted endpoint, or to read the supply
      line: which provider a turn actually resolves to, and what it costs.

  models:
    summary: How much context each model really has, and the sampling defaults.
    what: >-
      Two things a provider often gets wrong on your behalf: the token window a
      model actually offers, and the sampling parameters — temperature, max
      tokens, top-p, penalties — used when a profile doesn't set its own.
    why: >-
      Override a window when a model's declared one is wrong. An understated
      window makes conversations compact far earlier than they need to, which you
      experience as the agent forgetting things it should still be able to see.

  model-roles:
    summary: One model per workload, so features don't each need their own.
    what: >-
      Three roles — fast utility, deep reasoning, and summarizer — that features
      point at instead of naming a model. A feature left on its default follows
      its role; a model chosen explicitly on the feature always wins.
    why: >-
      Set these once and most of the platform is configured. Change a role to
      move every background task onto a cheaper or faster model without visiting
      a dozen sections to do it.

  search:
    summary: How the agent searches the web — and what that's allowed to cost.
    what: >-
      The search backend and its defaults, plus two budgets: how many searches an
      ordinary turn may run and how many a research turn may, each with an
      optional dollar ceiling. A source policy of preferred and blocked domains
      applies to every result.
    why: >-
      Come here to change backends, to cap spend, or to stop the agent reading a
      domain you don't trust. The budgets are the part worth understanding: they
      are per *turn*, not per day, and research turns draw on their own much
      larger allowance.

  images:
    summary: Generating pictures and speech, and re-reading the ones you send.
    what: >-
      Image generation for conversations and profile avatars, speech synthesis
      and transcription, and vision — whether images you attach are shown to the
      model again on later turns.
    why: >-
      Change the models when output quality or cost matters. The vision re-feed
      is the subtle one: showing an image on more turns keeps the agent able to
      refer back to it, and spends tokens every time it does.

  # ── Intelligence ─────────────────────────────────────────────────────────
  planner:
    summary: Whether the agent plans before it acts, and how far ahead.
    what: >-
      Task decomposition — breaking a request into subtasks before execution
      rather than working straight through it. A complexity threshold decides
      which requests are worth planning at all.
    why: >-
      Raise the threshold if simple requests are being over-planned; lower it if
      the agent charges into multi-step work with no structure and loses the
      thread halfway.

  thinking:
    summary: How agents reason in chat — scaffolds, critique, and consensus.
    what: >-
      The reasoning patterns compiled into a live streamed turn: step-by-step
      chains, principles-first step-back, self-critiquing reflection, and
      consensus sampling. A classifier picks one per turn unless you pin it.
    why: >-
      Turn individual patterns off when they cost more time than they earn on
      your kind of work. These are the global fallbacks — per-agent defaults live
      on the profile, and the composer chip overrides for one conversation.

  alloy:
    summary: Letting agents hand work to each other.
    what: >-
      Delegation: an agent dispatching a subtask to another agent, either ad-hoc
      from the roster or through a team you've defined. Depth, parallelism, and
      timeout bound how far a chain of that can run.
    why: >-
      Lower the depth or parallelism when delegation is running away with cost.
      Turn ad-hoc delegation off entirely if you want agents to work alone unless
      a team explicitly says otherwise.

  ambassador:
    summary: A parallel agent that briefs you without entering the conversation.
    what: >-
      A dedicated operator running alongside a conversation: it reads the
      transcript, answers questions about it, and can propose actions — but its
      tool belt never executes a write. Reads run automatically; anything that
      would change state comes back as a proposal for you to confirm.
    why: >-
      Change the model or context depth when briefings are too shallow or too
      expensive. The aide settings tune the parallel read fan-out behind it and
      rarely need touching.

  research:
    summary: Deep, cited research with a much larger budget than a normal turn.
    what: >-
      A per-conversation mode that raises the tool-round and search budgets, runs
      sub-questions in batches, and produces a report that reviews its own
      citations before it returns.
    why: >-
      Raise the round limit for genuinely broad questions; lower it to stop
      research becoming an expensive default. The minimum output budget matters
      more than it looks — a report starved of tokens returns early and
      half-formed rather than failing outright.

  # ── Prompts ──────────────────────────────────────────────────────────────
  prompt-stack:
    summary: The layered system prompt every agent starts from.
    what: >-
      A durable stack of prompt layers composed into the global system prompt.
      Agent names are not part of it — those are injected from the profile at
      composition time.
    why: >-
      Edit here to change behaviour across every agent at once. Anything that
      should apply to one agent belongs on that agent's profile instead.

  prompts:
    summary: Rewriting your prompt into a fuller one before it runs.
    what: >-
      An optional pass that expands what you typed into a more complete
      instruction, using its own model and temperature so it doesn't draw on the
      conversation's budget.
    why: >-
      Useful when you type quickly and want intent inferred. Turn it off when you
      need your exact wording to survive — it rewrites, and a rewrite can drop a
      constraint you meant literally.

  prompt-templates:
    summary: Reusable prompts, available in chat and the profile editor.
    what: >-
      A library of saved prompts you browse, create, and edit here; inserting one
      happens in chat, not on this screen.
    why: >-
      Build it up as you find phrasings that work. Nothing here changes agent
      behaviour on its own — a template does something only when you use it.

  feature-prompts:
    summary: Override the built-in prompts that features use internally.
    what: >-
      The prompts behind extraction, relevance filtering, planning, and prompt
      enhancement. Each ships with a default; an override replaces it, and a diff
      shows exactly what you changed.
    why: >-
      Worth touching only when a feature misbehaves in a way you can trace to its
      wording. Left on their defaults, these improve when the defaults do — an
      override opts that key out of future improvements.

  # ── Memory ───────────────────────────────────────────────────────────────
  memory-overview:
    summary: What the agent has remembered, and where it lives.
    what: >-
      Counts for what memory currently holds — entities, facts, turns, strategies
      — and which store each layer sits in.
    why: >-
      Check here before concluding that recall is broken. Most "the agent doesn't
      remember" reports are answered by this page rather than by Recall: memory
      that was never stored cannot be retrieved.

  context:
    summary: How much of the conversation the model sees, word for word.
    what: >-
      Per-turn context assembly — how much of the window recent turns may fill
      verbatim, when older turns fold into a running digest, and how tool output
      and long tool loops are compressed on the way in.
    why: >-
      The section to visit when a conversation starts losing detail, or when a
      long tool run is eating the window. With a correctly declared model window,
      most conversations never compact at all.

  memory-recall:
    summary: How the agent searches its own memory for a turn.
    what: >-
      Five retrieval techniques over stored memory — hybrid keyword-and-meaning
      search, entity-centric expansion, query expansion, HyDE, and self-query —
      followed by a cross-encoder that re-ranks whatever they found.
    why: >-
      Turn techniques on for recall quality and off for latency and cost: each is
      another pass over the same memory. Every knob here belongs to exactly one
      technique, so a technique you've turned off costs nothing anywhere else.

  memory-consolidation:
    summary: Turning finished conversations into facts, entities, and procedures.
    what: >-
      The background pipeline that reads completed turns and keeps what's worth
      keeping: facts and their confidence, entities and the links between them,
      contradictions and corrections against what is already stored, and
      distilled "how we work" procedures.
    why: >-
      Raise the confidence thresholds when memory accumulates things that aren't
      true; lower them when it drops things you said plainly. The job intervals
      decide how quickly a conversation becomes memory at all.

  # ── Tools & Interface ────────────────────────────────────────────────────
  translation:
    summary: Local translation across 200+ languages.
    what: >-
      An on-device NLLB-200 model with language detection. It runs locally, so
      nothing being translated leaves the machine.
    why: >-
      Nothing here needs configuring for normal use. Worth knowing about because
      the model loads eagerly — it is the largest thing the server pulls on a
      first request.

  appearance:
    summary: How the app looks.
    what: >-
      Theme selection. Each theme is a complete token set, so switching one
      changes the whole surface rather than a single colour.
    why: >-
      Personal preference; nothing here affects how agents behave.
