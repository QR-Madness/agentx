# Dependabot version updates (Decisions.md ADR-20). Security alerts and security-update
# PRs are a repository setting (Settings → Code security), not this file. Version updates
# wait out a cooldown so a bad release has time to be yanked; security updates skip it.
# Updates are grouped (minor+patch, majors apart) so each directory opens at most two PRs.
# Note: Dependabot raises security-update PRs for uv but not bun; for bun, the
# Security audit workflow is what catches advisories.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]

  - package-ecosystem: uv
    directory: "/manager"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]

  - package-ecosystem: bun
    directory: "/client"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]

  - package-ecosystem: bun
    directory: "/manager/ui"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]

  - package-ecosystem: bun
    directory: "/docs-site"
    schedule:
      interval: monthly
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: "/manager"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
